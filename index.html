<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070f">
<meta name="robots" content="noindex,nofollow">
<title>Painel MunizFlix</title>
<link rel="icon" href="mark.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel MF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
/* Painel MunizFlix — versão 2 (2026-11): Início, Ao vivo, Clientes, Financeiro, Avisos, Proteção, Ajustes */
:root{--bg:#08070f;--bg2:#0d0b19;--card:#131022;--card2:#1a1630;--card3:#241e40;--line:rgba(160,130,255,.14);--line2:rgba(255,255,255,.07);
 --tx:#f4f1fb;--tx2:#c8c1de;--mut:#8d86a8;--acc:#a855f7;--grad:linear-gradient(135deg,#7c3aed,#c026d3);
 --ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--info:#60a5fa;--side:248px;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(80% 45% at 0% 0%,rgba(124,58,237,.14),transparent 60%),radial-gradient(60% 40% at 100% 100%,rgba(192,38,211,.08),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
a{color:inherit;text-decoration:none}
.hide{display:none!important}
.sp{flex:1}
.i{flex:none;display:block}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
::selection{background:rgba(168,85,247,.4)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:99px;border:2px solid transparent;background-clip:padding-box}

/* ---------- botões, campos, etiquetas ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14px;background:var(--card2);border:1px solid var(--line2);color:var(--tx);white-space:nowrap;transition:transform .12s,filter .15s,background .15s}
.btn:hover{background:var(--card3)}.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 10px 26px -12px rgba(192,38,211,.9)}.btn.pri:hover{filter:brightness(1.12)}
.btn.ok{color:var(--ok);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.09)}.btn.ok:hover{background:rgba(52,211,153,.16)}
.btn.bad{color:var(--bad);border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.08)}.btn.bad:hover{background:rgba(251,113,133,.16)}
.btn.solid.bad{background:#e11d48;color:#fff;border-color:transparent}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:6px}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:rgba(255,255,255,.07)}
.btn.ico{width:42px;padding:0}.btn.ico.sm{width:34px}
.btn.wide{width:100%}
.lnk{color:#c4b5fd;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}.lnk:hover{color:#e9d5ff}
.field,select.field,textarea.field{width:100%;height:44px;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:12px;padding:0 13px;font-size:15px;outline:none;transition:border-color .15s,background .15s}
textarea.field{height:auto;padding:11px 13px;line-height:1.5;resize:vertical}
.field:focus{border-color:var(--acc);background:rgba(168,85,247,.06)}
select.field option{background:#1a1630}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--tx2)}label.f>.field,label.f>span,label.f>textarea{margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--tx2);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:rgba(52,211,153,.32);background:rgba(52,211,153,.08)}
.tag.warn{color:var(--warn);border-color:rgba(251,191,36,.32);background:rgba(251,191,36,.08)}
.tag.bad{color:var(--bad);border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.08)}
.tag.info{color:var(--info);border-color:rgba(96,165,250,.32);background:rgba(96,165,250,.08)}
.code{font-family:ui-monospace,Consolas,monospace;font-weight:700;letter-spacing:.04em}
.h{font-size:13px;color:var(--mut);line-height:1.55}
.empty{padding:26px 16px;text-align:center;color:var(--mut);font-size:14px;border:1px dashed var(--line2);border-radius:14px}
.msg{font-size:13.5px;margin-top:10px;min-height:18px;color:var(--bad)}.msg.ok{color:var(--ok)}

/* estado de cada tela: assistindo (verde pulsando), online (azul), offline (cinza), aguardando (âmbar) */
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:#4b4563}
.dot.on{background:var(--info)}.dot.play{background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 1.8s infinite}.dot.novo{background:transparent;border:2px solid var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;padding:4px 11px 4px 9px;border-radius:99px;background:rgba(255,255,255,.05);color:var(--mut);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.play{color:var(--ok);background:rgba(52,211,153,.12)}.pill.play i{animation:pulse 1.8s infinite}
.pill.on{color:var(--info);background:rgba(96,165,250,.12)}.pill.novo{color:var(--warn);background:rgba(251,191,36,.1)}

/* ---------- estrutura ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);display:flex;flex-direction:column;gap:6px;padding:18px 12px 14px;background:rgba(13,11,25,.82);backdrop-filter:blur(18px);border-right:1px solid var(--line);z-index:30}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 16px;font-weight:900;font-size:19px;letter-spacing:-.02em}
.brand img{width:36px;height:36px;border-radius:11px}
.brand i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:10px;letter-spacing:.22em;color:var(--mut);font-weight:800;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--tx2);font-weight:700;font-size:14.5px;width:100%;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.05);color:var(--tx)}
.nav button.on{background:linear-gradient(90deg,rgba(124,58,237,.3),rgba(192,38,211,.1));color:#fff;box-shadow:inset 3px 0 0 #a855f7}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.08);color:var(--tx2);padding:2px 8px;border-radius:99px}
.nav .cnt.live{background:rgba(52,211,153,.15);color:var(--ok)}.nav .cnt.bad{background:#e11d48;color:#fff}.nav .cnt.warn{background:rgba(251,191,36,.16);color:var(--warn)}
.nav hr{border:0;border-top:1px solid var(--line2);margin:8px 10px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
.live{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--tx2);padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
.live.err{color:var(--bad)}.live.err i{background:var(--bad);animation:none}
.live small{color:var(--mut);font-weight:600;margin-left:auto}
.main{margin-left:var(--side);min-height:100vh}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 28px;background:rgba(8,7,15,.78);backdrop-filter:blur(16px);border-bottom:1px solid var(--line2)}
.top .brand{display:none;padding:0;font-size:17px}.top .brand img{width:30px;height:30px}
.srch{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--mut);font-size:14px;font-weight:500}
.srch{min-width:0}.srch span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch:hover{border-color:rgba(168,85,247,.45);color:var(--tx2)}
.srch kbd{margin-left:auto;flex:none;white-space:nowrap;font:inherit;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--mut)}
.wrap{padding:26px 28px 60px;max-width:1320px}
.wrap.enter>*{animation:up .38s cubic-bezier(.2,.7,.2,1) both}.wrap.enter>*:nth-child(2){animation-delay:.04s}.wrap.enter>*:nth-child(3){animation-delay:.08s}.wrap.enter>*:nth-child(4){animation-delay:.12s}.wrap.enter>*:nth-child(n+5){animation-delay:.16s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tabbar{display:none}
.pagehd{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.pagehd h1{font-size:26px;font-weight:900;letter-spacing:-.03em}
.pagehd p{color:var(--mut);font-size:14px;margin-top:4px}

/* ---------- blocos ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel>h2,.ph{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:800;margin-bottom:14px}
.ph .n,.panel>h2 .n{font-size:12px;color:var(--mut);font-weight:700}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
.cols.c16{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line2);min-width:0}
.row.click{cursor:pointer;transition:background .15s,border-color .15s}.row.click:hover{background:rgba(168,85,247,.08);border-color:rgba(168,85,247,.35)}
.row .k{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--tx2)}
.row .k.play{background:rgba(52,211,153,.14);color:var(--ok)}.row .k.bad{background:rgba(251,113,133,.14);color:var(--bad)}.row .k.warn{background:rgba(251,191,36,.14);color:var(--warn)}.row .k.ok{background:rgba(52,211,153,.14);color:var(--ok)}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.acts{display:flex;align-items:center;gap:8px;flex:none}
.rank{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;background:rgba(168,85,247,.16);color:#d8b4fe}
.meter{height:4px;border-radius:99px;background:rgba(255,255,255,.06);margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;background:var(--grad);border-radius:99px}
.av{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 65% 46%),hsl(calc(var(--h) + 40) 70% 38%))}
.av.lg{width:54px;height:54px;border-radius:17px;font-size:19px}

/* Início */
.hello{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.hello h1{font-size:28px;font-weight:900;letter-spacing:-.03em}.hello p{color:var(--mut);margin-top:4px;font-size:14px}.hello p::first-letter{text-transform:uppercase}
.attn{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.at{display:flex;align-items:center;gap:13px;padding:14px;border-radius:16px;border:1px solid var(--line2);background:var(--card);cursor:pointer;transition:transform .15s,border-color .15s}
.at:hover{transform:translateY(-2px)}
.at .k{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.at b{display:block;font-size:14.5px}.at small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;line-height:1.4}
.at .go{margin-left:auto;color:var(--mut)}
.at.bad{border-color:rgba(251,113,133,.4);background:linear-gradient(135deg,rgba(251,113,133,.1),var(--card))}.at.bad .k{background:rgba(251,113,133,.16);color:var(--bad)}
.at.warn{border-color:rgba(251,191,36,.35);background:linear-gradient(135deg,rgba(251,191,36,.08),var(--card))}.at.warn .k{background:rgba(251,191,36,.15);color:var(--warn)}
.at.info{border-color:rgba(96,165,250,.3)}.at.info .k{background:rgba(96,165,250,.14);color:var(--info)}
.allok{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:14px;border:1px solid rgba(52,211,153,.28);background:rgba(52,211,153,.06);color:var(--ok);font-weight:700;font-size:14px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{position:relative;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);overflow:hidden}
.kpi.click{cursor:pointer;transition:transform .15s,border-color .15s}.kpi.click:hover{transform:translateY(-2px);border-color:rgba(168,85,247,.45)}
.kpi .kh{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--tx2)}
.kpi .kh span{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(168,85,247,.16);color:#d8b4fe}
.kpi b{display:block;font-size:29px;font-weight:900;letter-spacing:-.03em;margin-top:12px;font-variant-numeric:tabular-nums}
.kpi em{display:block;font-style:normal;color:var(--mut);font-size:12.5px;margin-top:3px}
.kpi.hl{background:linear-gradient(135deg,rgba(124,58,237,.34),rgba(192,38,211,.14) 70%,var(--card));border-color:rgba(168,85,247,.45)}
.kpi.hl .kh span{background:rgba(52,211,153,.18);color:var(--ok)}
.sum{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:8px}.sum b{display:block;font-size:19px;font-weight:800}.sum small{color:var(--mut);font-size:12px}
.chart{position:relative}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:rgba(255,255,255,.06);stroke-width:1}.chart .ax{fill:var(--mut);font-size:11px;font-weight:600}
.chart .bar{fill:#a855f7}.chart .bar.today{fill:#e879f9}.chart .hit{fill:transparent}.chart g:hover .bar{fill:#c084fc}
.tip{position:absolute;pointer-events:none;background:#231d36;border:1px solid rgba(168,85,247,.45);border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tip small{display:block;color:var(--mut);font-weight:600;font-size:11.5px}
.note{font-size:12px;color:var(--mut);margin-top:10px}

/* filtros */
.fil{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fil button{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line2);font-weight:700;font-size:13.5px;color:var(--tx2);transition:border-color .15s,background .15s}
.fil button b{font-size:13px;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--tx)}
.fil button:hover{border-color:rgba(168,85,247,.4)}
.fil button.on{background:rgba(168,85,247,.16);border-color:rgba(168,85,247,.55);color:#fff}
.fil .f-play b,.fil .f-ok b{color:var(--ok)}.fil .f-on b{color:var(--info)}.fil .f-novo b,.fil .f-breve b{color:var(--warn)}.fil .f-venc b{color:var(--bad)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .inp{flex:1;min-width:220px;position:relative}.bar .inp .i{position:absolute;left:13px;top:13px;color:var(--mut)}.bar .inp input{padding-left:40px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line2)}
.seg button{padding:7px 13px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mut)}.seg button.on{background:var(--card3);color:#fff}

/* Ao vivo: cartão de cada tela */
.grp{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2)}
.grp:first-of-type{margin-top:4px}.grp span{color:var(--mut);font-weight:700}.grp::after{content:"";flex:1;height:1px;background:var(--line2)}
.tvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tv{position:relative;display:flex;flex-direction:column;gap:10px;padding:15px;border-radius:var(--r);background:var(--card);border:1px solid var(--line2);cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;overflow:hidden}
.tv:hover{transform:translateY(-2px);border-color:rgba(168,85,247,.5);box-shadow:0 16px 40px -22px rgba(168,85,247,.7)}
.tv::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:#3a3552}
.tv.e-play{border-color:rgba(52,211,153,.35);background:linear-gradient(160deg,rgba(52,211,153,.08),var(--card) 55%)}.tv.e-play::before{background:var(--ok)}
.tv.e-on::before{background:var(--info)}.tv.e-novo::before{background:var(--warn)}
.tv.e-off{opacity:.78}.tv.desl{opacity:.6}
.tv header,.tv footer{display:flex;align-items:center;gap:8px}
.tv .sig{display:inline-flex;align-items:center;gap:4px;color:var(--mut);font-size:11.5px;font-weight:600}
.tv h3{font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv .who{color:var(--mut);font-size:13px;margin-top:-6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowb{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;background:rgba(255,255,255,.04);min-width:0;color:var(--tx2)}
.nowb>div{min-width:0}.nowb b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowb small{display:block;color:var(--mut);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowb.play{background:rgba(52,211,153,.1);color:var(--ok)}.nowb.play b{color:#fff}
.nowb.big{padding:15px}.nowb.big b{font-size:16.5px;white-space:normal}
.tv footer{color:var(--mut);font-size:12.5px}.tv .plat{display:inline-flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv .plat{flex:1 1 0}.tv .hoje{flex:none;white-space:nowrap}.tv .hoje b{color:var(--tx)}.tv footer .btn{flex:none}

/* Clientes */
.ctab{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.chd,.crow{display:grid;grid-template-columns:minmax(210px,2.1fr) 150px minmax(110px,1fr) minmax(120px,1fr) 100px 150px;gap:12px;align-items:center;padding:12px 16px}
.chd{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);background:rgba(255,255,255,.03)}
.crow{border-top:1px solid var(--line2);cursor:pointer;transition:background .15s}.crow:hover{background:rgba(168,85,247,.07)}
.crow.off{opacity:.55}
.cnm{display:flex;align-items:center;gap:12px;min-width:0}.cnm>div{min-width:0}
.cnm b,.c2 b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* janela lateral (cliente / tela) */

.sh{width:min(540px,100%);height:100%;background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-30px 0 80px rgba(0,0,0,.5)}
.shov.in{animation:fade .2s both}.shov.in .sh{animation:slide .28s cubic-bezier(.2,.7,.2,1) both}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.shh{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 14px;border-bottom:1px solid var(--line2)}
.sht{flex:1;min-width:0}.sht h2{font-size:21px;font-weight:900;letter-spacing:-.02em;margin-top:8px;overflow-wrap:anywhere}
.sht p{color:var(--mut);font-size:13.5px;margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.shb{flex:1;overflow-y:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:18px}
.shb section h4{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.lk{color:#c4b5fd;font-weight:700;cursor:pointer}.lk:hover{text-decoration:underline}
.codeb{display:inline-flex;align-items:center;gap:8px;font-family:ui-monospace,Consolas,monospace;font-weight:800;font-size:22px;letter-spacing:.06em;color:#fff;padding:8px 16px;border-radius:12px;background:var(--grad);box-shadow:0 6px 18px -6px rgba(192,38,211,.7);cursor:pointer;transition:filter .15s,transform .12s}.codeb:hover{filter:brightness(1.15)}.codeb:active{transform:scale(.97)}.codeb svg{width:18px;height:18px;opacity:.85}
.codetag{flex:none;margin-left:auto;font-family:ui-monospace,Consolas,monospace;font-weight:900;font-size:26px;letter-spacing:.08em;color:#fff;padding:10px 20px;border-radius:14px;background:linear-gradient(135deg,#a855f7,#ec4899);box-shadow:0 0 20px rgba(168,85,247,.5),0 8px 24px -6px rgba(236,72,153,.6);text-shadow:0 2px 8px rgba(0,0,0,.4);white-space:nowrap;line-height:1}
.codebox{flex:none;margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 18px;border-radius:14px;background:linear-gradient(135deg,#a855f7,#ec4899);box-shadow:0 0 24px rgba(168,85,247,.55),0 8px 28px -6px rgba(236,72,153,.65);min-width:110px}
.codelbl{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.codeval{font-family:ui-monospace,Consolas,monospace;font-weight:900;font-size:28px;letter-spacing:.1em;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5);line-height:1}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.qa .btn{height:46px}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st3>div{padding:11px;border-radius:13px;background:rgba(255,255,255,.04);text-align:center}.st3 b{display:block;font-size:17px;font-weight:800}.st3 small{color:var(--mut);font-size:11.5px}
.spark{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:10px}.spark i{flex:1;border-radius:3px;background:#a855f7;min-height:3px}.spark i.z{background:rgba(255,255,255,.08)}.spark i.today{background:#e879f9}
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:13.5px;padding:13px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line2)}
.dl dt{color:var(--mut)}.dl dd{font-weight:600;text-align:right;overflow-wrap:anywhere}
.arow{display:flex;align-items:center;gap:13px;width:100%;padding:12px 13px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line2);transition:background .15s,border-color .15s}
.arow:hover{background:rgba(168,85,247,.09);border-color:rgba(168,85,247,.4)}
.arow>.i:first-child{color:#c4b5fd}.arow div{flex:1;min-width:0}.arow b{display:block;font-size:14.5px}.arow small{display:block;color:var(--mut);font-size:12.5px;margin-top:1px;line-height:1.4}
.arow>.i:last-child{color:var(--mut)}
.arow.bad>.i:first-child,.arow.bad b{color:var(--bad)}.arow.bad:hover{background:rgba(251,113,133,.08);border-color:rgba(251,113,133,.4)}
.venc{display:flex;align-items:center;gap:14px;padding:15px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(124,58,237,.18),var(--card))}
.venc.bad{border-color:rgba(251,113,133,.4);background:linear-gradient(135deg,rgba(251,113,133,.14),var(--card))}.venc.warn{border-color:rgba(251,191,36,.38);background:linear-gradient(135deg,rgba(251,191,36,.1),var(--card))}
.venc div{flex:1;min-width:0}.venc small{display:block;color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.venc b{display:block;font-size:20px;font-weight:900;margin-top:2px}.venc em{display:block;font-style:normal;font-size:13px;color:var(--tx2);margin-top:1px}

/* janelas (confirmações, formulários, busca) */
.ov{position:fixed;inset:0;z-index:70;background:rgba(4,3,10,.7);backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;animation:fade .18s both}
.dlg{width:min(470px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 40px 100px rgba(0,0,0,.6);animation:pop .22s cubic-bezier(.2,.8,.2,1) both}
.dlg.wide{width:min(620px,100%)}
@keyframes pop{from{transform:scale(.95) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.dlg h3{font-size:19px;font-weight:900;letter-spacing:-.02em;margin-bottom:6px}
.dlg p.dm{color:var(--tx2);font-size:14.5px;line-height:1.55;white-space:pre-line}
.dlg .dic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:rgba(168,85,247,.18);color:#d8b4fe;margin-bottom:14px}

.dlg label.f{margin-top:12px}
.drow{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chipb{padding:7px 13px;border-radius:99px;font-size:13px;font-weight:700;background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--tx2)}.chipb:hover,.chipb.on{border-color:rgba(168,85,247,.6);background:rgba(168,85,247,.18);color:#fff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.opt{padding:13px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.03);transition:border-color .15s,background .15s}
.opt b{display:block;font-size:15px}.opt small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.opt.on{border-color:#a855f7;background:rgba(168,85,247,.18)}.opt:hover{border-color:rgba(168,85,247,.5)}
.pal{padding:0;overflow:hidden;align-self:start;margin-top:8vh;width:min(600px,100%)}
.palin{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line2);color:var(--mut)}
.palin input{flex:1;background:none;border:0;outline:0;font-size:16.5px}
#palRes{max-height:min(56vh,480px);overflow-y:auto;padding:8px}
.pr{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px}.pr:hover,.pr.sel{background:rgba(168,85,247,.16)}
.pr .k{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--tx2)}
.pr div{flex:1;min-width:0}.pr b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pr small{display:block;color:var(--mut);font-size:12.5px}
.palh{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:10px 12px 4px}
#toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 24px)}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:#231d36;border:1px solid rgba(168,85,247,.45);font-weight:700;font-size:14px;box-shadow:0 18px 50px rgba(0,0,0,.55);animation:pop .22s both;max-width:100%}
.toast .i{color:var(--ok)}.toast.err{border-color:rgba(251,113,133,.55)}.toast.err .i{color:var(--bad)}

/* Financeiro */
.meses{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:6px}
.meses div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.meses i{display:block;width:100%;max-width:54px;border-radius:9px 9px 3px 3px;background:var(--grad);min-height:3px;opacity:.75}.meses div:last-child i{opacity:1}
.meses b{font-size:11.5px;font-weight:800;white-space:nowrap}.meses small{font-size:11.5px;color:var(--mut);text-transform:capitalize}

/* Avisos */
.avg{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.tvprev{border-radius:var(--r);padding:16px;background:var(--card);border:1px solid var(--line);align-self:start}
.tvscr{aspect-ratio:16/9;border-radius:12px;border:5px solid #26223a;background:radial-gradient(circle at 30% 20%,#2a1a4f,#0b0914);display:grid;place-items:center;padding:14px;overflow:hidden}
.ntc{width:min(320px,100%);padding:14px;border-radius:14px;background:rgba(19,16,34,.95);border:1px solid rgba(168,85,247,.5);text-align:center}
.ntc b{display:block;font-size:14px}.ntc p{font-size:11.5px;color:var(--tx2);margin:6px 0 10px;line-height:1.45;overflow-wrap:anywhere}
.ntc span{display:inline-block;font-size:11px;font-weight:800;padding:6px 12px;border-radius:8px;background:var(--grad);margin:0 3px}.ntc span.sec{background:rgba(255,255,255,.1)}

/* Proteção */
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.box h3{font-size:16px;font-weight:800}
.pr-hero{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
.pr-hero.on{border-color:rgba(52,211,153,.4);background:linear-gradient(135deg,rgba(52,211,153,.12),var(--card))}
.pr-hero h2{font-size:20px;font-weight:900;margin-bottom:4px}.pr-hero p{color:var(--tx2);font-size:14px;line-height:1.5}.pr-hero>div:nth-child(2){flex:1}
.pr-big{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--mut);flex:none}
.pr-hero.on .pr-big{background:rgba(52,211,153,.16);color:var(--ok)}
.pr-step{display:flex;gap:14px}.pr-c{flex:1;min-width:0}.pr-c h3{margin:4px 0 4px}
.pr-n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--grad);color:#fff}
.pr-step.done .pr-n{background:var(--ok);color:#06210f}
.pr-bar{height:12px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:12px}.pr-bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.pr-pct{margin:6px 0 10px;font-size:14px}
.pr-alerta{border-color:rgba(251,113,133,.5);background:linear-gradient(135deg,rgba(251,113,133,.1),var(--card))}.pr-alerta h3{color:var(--bad);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.pr-grupos{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.pr-gh{display:flex;gap:10px;align-items:center;margin-bottom:8px;width:100%;padding:8px;border-radius:14px}.pr-gh:hover{background:rgba(255,255,255,.04)}.pr-gh>div{flex:1;min-width:0}.pr-ver{display:inline-flex;align-items:center;gap:4px;color:#c4b5fd;font-size:13px;font-weight:700;white-space:nowrap}.pr-gh[aria-expanded=true] .pr-ver .i{transform:rotate(90deg)}.pr-gh b{display:block;font-size:15px}.pr-gh small{color:var(--tx2);font-size:13px}
.pr-gi{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:rgba(52,211,153,.12);color:var(--ok);flex:none}
.pr-antigo .pr-gi{background:rgba(251,191,36,.14);color:var(--warn)}.pr-falso .pr-gi{background:rgba(251,113,133,.16);color:var(--bad)}
.pr-antigo .pr-gh small{color:var(--warn)}.pr-falso .pr-gh small{color:var(--bad)}
.pr-num{display:inline-block;min-width:22px;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.08);font-size:12px;text-align:center}
.pr-sim{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 8px}.pr-sim .tag{font-size:13px;padding:5px 11px}
.pr-calma{margin-top:14px;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.04)}

/* Ajustes */
.ajn{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding:5px;border-radius:15px;background:rgba(255,255,255,.04);border:1px solid var(--line2);width:fit-content;max-width:100%}
.ajn button{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--mut)}
.ajn button:hover{color:var(--tx)}.ajn button.on{background:var(--card3);color:#fff}
.bxh{display:flex;gap:13px;align-items:flex-start;margin-bottom:16px}
.bxi{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(168,85,247,.16);color:#d8b4fe}
.bxf{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pc{padding:14px;border-radius:15px;background:rgba(255,255,255,.03);border:1px solid var(--line2);display:flex;flex-direction:column;gap:11px}
.pch{display:flex;align-items:center;gap:8px}.pnm{flex:1;min-width:0;background:none;border:0;border-bottom:1px dashed var(--line2);font-size:16px;font-weight:800;padding:3px 0;outline:0}.pnm:focus{border-color:var(--acc)}
.pcf{display:grid;grid-template-columns:80px 1fr;gap:10px}
.money{display:flex;align-items:center;gap:6px}.money i{font-style:normal;color:var(--mut);font-weight:700}
.pc.add{align-items:center;justify-content:center;border-style:dashed;color:var(--mut);font-weight:700;min-height:150px;gap:6px}.pc.add:hover{color:#fff;border-color:var(--acc)}
.lockpv{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px;border-radius:14px;background:radial-gradient(circle at 50% 0,#2a1a4f,#0b0914);border:1px solid var(--line2);margin-bottom:14px;text-align:center}
.lockpv img{width:42px;height:42px;border-radius:12px}.lockpv b{font-size:16px}.lockpv span{color:var(--tx2);font-size:13px}
.svs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
.sv{position:relative;padding:16px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--line2);display:flex;flex-direction:column;gap:12px;overflow:hidden}
.sv::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--line2)}
.sv.ok::before{background:var(--ok)}.sv.warn::before{background:var(--warn)}.sv.bad::before{background:var(--bad)}
.sv.warn{border-color:rgba(251,191,36,.35)}.sv.bad{border-color:rgba(251,113,133,.4);background:linear-gradient(135deg,rgba(251,113,133,.07),transparent)}
.svh{display:flex;align-items:center;gap:11px}.svh .tag{flex:none;font-size:13px;padding:5px 12px}
.svi{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(168,85,247,.16);color:#d8b4fe}
.svt{flex:1;min-width:0}.svt small{display:block;color:var(--mut);font-size:12.5px;font-weight:600;margin-top:2px}
.svf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svb{display:flex;gap:8px;flex-wrap:wrap}.svb .btn{flex:1;justify-content:center;white-space:nowrap}
.svn{font-size:12px;margin-top:-4px}
.svd{border-top:1px solid var(--line2);padding-top:10px}.svd summary{cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:var(--tx2);list-style:none;padding:4px 0}

.sv.add{align-items:center;justify-content:center;border-style:dashed;color:var(--mut);font-weight:700;min-height:120px;gap:6px}.sv.add::before{display:none}.sv.add:hover{color:#fff;border-color:var(--acc)}
.pw{position:relative;display:block}.pw .eye{position:absolute;right:6px;top:6px;width:32px;height:32px;display:grid;place-items:center;color:var(--mut);border-radius:8px}.pw .eye:hover{color:#fff;background:rgba(255,255,255,.08)}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line2)}
.lrow .k{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(168,85,247,.14);color:#d8b4fe}
.lrow div{flex:1;min-width:0}.lrow b{display:block;font-size:14.5px}.lrow small{display:block;color:var(--mut);font-size:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow code{font-family:ui-monospace,Consolas,monospace;color:#d8b4fe;font-size:13px}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lg{width:min(380px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:30px 26px;border-radius:26px;background:rgba(19,16,34,.75);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 40px 120px -40px rgba(168,85,247,.5)}
.lg img{width:76px;height:76px;border-radius:22px;box-shadow:0 0 60px rgba(192,38,211,.5)}
.lg h1{font-size:27px;font-weight:900;letter-spacing:-.03em}.lg h1 i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg p{color:var(--mut);font-size:14px;margin-bottom:6px}.lg .btn{width:100%;height:46px}

/* ---------- celular ---------- */

 .crow{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px}.crow .c-pl,.crow .c-tv{display:none}.crow .c-st{grid-row:2;grid-column:1;padding-left:52px}.crow .c-ve{grid-row:2;grid-column:2;text-align:right}.crow .c-ve b{display:none}.crow .cac{grid-row:1;grid-column:2}}
@media (max-width:900px){
 .side{display:none}.main{margin-left:0;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
 .top{padding:10px 14px;gap:8px}.top .brand{display:flex}.top .brand span{display:none}
 .srch{max-width:none}.srch kbd{display:none}.top .sp{display:none}
 .top .btn.pri span,.top .live{display:none}.top .btn.pri{width:42px;padding:0}
 .wrap{padding:18px 14px 30px}
 .tabbar{position:fixed;inset:auto 0 0 0;z-index:30;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(13,11,25,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
 .tabbar button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px;border-radius:12px;font-size:10.5px;font-weight:700;color:var(--mut)}
 .tabbar button.on{color:#fff;background:rgba(168,85,247,.2)}
 .tabbar .bdg{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;font-size:10px;font-weight:800;display:grid;place-items:center;background:var(--ok);color:#052e1b}.tabbar .bdg.bad{background:#e11d48;color:#fff}

const ic=(n,s=18)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`

/* ---------- avisos rápidos e janelas ---------- */
function toast(t,err){const e=document.createElement('div');e.className='toast'+(err?' err':'');e.innerHTML=ic(err?'alert':'check')+'<span></span>';e.lastChild.textContent=t
 const box=$('toasts');while(box.children.length>2)box.firstChild.remove();box.appendChild(e);setTimeout(()=>e.remove(),err?6500:2800)}
function erro(e){console.error(e);toast('Não deu certo: '+(e?.message||e),true)}
let dlgRes=null
function dialogo(html,cls=''){$('modal').innerHTML=`<div class="ov" onclick="if(event.target===this)fechar()"><div class="dlg ${cls}" role="dialog" aria-modal="true">${html}</div></div>`
 const f=$('modal').querySelector('[autofocus]')||$('modal').querySelector('.btn.pri,.btn.solid');if(f)setTimeout(()=>f.focus(),30)}
function fechar(v){$('modal').innerHTML='';if(dlgRes){const r=dlgRes;dlgRes=null;r(v)}}
/** Pergunta "tem certeza?" dentro do painel (no lugar da caixinha do navegador). Devolve true/false. */
function confirmar({t,m,ok='Confirmar',perigo=false,icone}){return new Promise(res=>{fechar();dlgRes=v=>res(v===true)
 dialogo(`<div class="dic${perigo?' bad':''}">${ic(icone||(perigo?'alert':'check'),24)}</div><h3>${esc(t)}</h3>${m?`<p class="dm">${esc(m)}</p>`:''}
  <div class="drow"><button class="btn" onclick="fechar(false)">Cancelar</button><button class="btn ${perigo?'bad solid':'pri'}" onclick="fechar(true)">${esc(ok)}</button></div>`)})}
/** Pede um texto. Devolve o texto, ou null se cancelar. */
function perguntar({t,m,label,valor='',ph='',ok='Salvar'}){return new Promise(res=>{fechar();dlgRes=v=>res(typeof v==='string'?v:null)
 dialogo(`<h3>${esc(t)}</h3>${m?`<p class="dm">${esc(m)}</p>`:''}<label class="f">${esc(label||'')}<input class="field" id="dIn" autofocus value="${esc(valor)}" placeholder="${esc(ph)}" maxlength="60" onkeydown="if(event.key==='Enter')fechar(this.value)"></label>
  <div class="drow"><button class="btn" onclick="fechar()">Cancelar</button><button class="btn pri" onclick="fechar($('dIn').value)">${esc(ok)}</button></div>`)})}

 const email=$('lgEmail').value.trim(),password=$('lgPass').value,m=$('lgMsg');m.className='msg';m.textContent=''

 $('lgGo').disabled=true
 try{
  if(modoCriar){const{data,error}=await sb.auth.signUp({email,password});if(error)throw error
   if(!data.session){m.className='msg ok';m.textContent='Login criado! Agora peça a liberação e depois entre com seu e-mail e senha.';modoCriar=true;$('lgSwap').click();return}}
  else{const{error}=await sb.auth.signInWithPassword({email,password});if(error)throw error}

 }catch(e){m.textContent=/Invalid login/i.test(e.message)?'E-mail ou senha incorretos.':/not confirmed/i.test(e.message)?'Login ainda não liberado.':e.message}
 finally{$('lgGo').disabled=false}}

/* ---------- Dados ---------- */
let D={plans:[],clients:[],codes:[],cfg:null,remotes:[],pays:[],nts:[],st:{codes:{},days:{},top:[]}},loadedAt=0,falha=false,pulsos=0
const COLS='code,client_id,label,active,device_tag,device_model,app_version,activated_at,last_seen,watching,watching_kind,watching_since,created_at,app_sig,app_plat,app_origin,copia_em'
const PAGES=[['inicio','Início','home'],['aovivo','Ao vivo','tv'],['clientes','Clientes','users'],['financeiro','Financeiro','wallet'],['avisos','Avisos','mega'],['protecao','Proteção','shield'],['ajustes','Ajustes','gear']]
const ANTIGO={geral:'inicio',telas:'aovivo',pagamentos:'financeiro'}
let tab=(()=>{let h=location.hash.slice(1);h=ANTIGO[h]||h;return PAGES.some(p=>p[0]===h)?h:'inicio'})()

/** Carga completa (tudo). Roda ao abrir, depois de cada ação e a cada minuto. */
async function carregar(o={}){
 try{
  // antes de ler: fecha o que ficou "assistindo" em TVs que sumiram
  await sb.rpc('admin_refresh').then(()=>{},()=>{})
  const [p,c,k,g,rm,st,py,nn]=await Promise.all([
   sb.from('plans').select('*').order('screens'),
   sb.from('clients').select('*').order('name'),
   sb.from('codes').select(COLS).order('created_at'),
   sb.from('app_config').select('*').eq('id',1).single(),
   sb.from('remotes').select('id,code,name,last_seen,approved_at').eq('status','ok').order('approved_at'),
   sb.rpc('admin_watch_stats',{p_days:30}),
   sb.from('payments').select('id,client_id,code,amount,status,created_at,paid_at,new_expires_at').order('created_at',{ascending:false}).limit(400),
   sb.from('notices').select('id,client_id,title,kind,created_at').order('id',{ascending:false}).limit(300)])
  for(const r of [p,c,k,g])if(r.error)throw r.error
  D={plans:p.data,clients:c.data,codes:k.data,cfg:g.data,remotes:rm.error?[]:rm.data,pays:py.error?[]:py.data,nts:nn.error?[]:nn.data,st:st.error||!st.data?{codes:{},days:{},top:[]}:st.data}
  loadedAt=Date.now();falha=false;render();if(o.manual)toast('Atualizado')
 }catch(e){falha=true;liveHtml();if(!o.quieto)erro(e)}}
/** Batida leve a cada 10 s: só o estado das telas (quem está online / assistindo). */
const ocupado=()=>document.hidden||!!$('modal').innerHTML||tab==='ajustes'||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')
async function pulso(){
 if(ocupado())return
 if(++pulsos%6===0)return carregar({quieto:true})
 try{await sb.rpc('admin_refresh').then(()=>{},()=>{})
  const k=await sb.from('codes').select(COLS).order('created_at');if(k.error)throw k.error
  if(ocupado())return
  D.codes=k.data;loadedAt=Date.now();falha=false;render()
 }catch(e){falha=true;liveHtml()}}
const plano=id=>D.plans.find(p=>p.id===id)
const codigosDe=id=>D.codes.filter(c=>c.client_id===id)
const clienteDe=k=>D.clients.find(x=>x.id===k.client_id)
const stOf=code=>D.st.codes?.[code]||{today:0,week:0,month:0,sessions:0,days:{},recent:[]}

/* ---------- estado de cada tela ---------- */
const sinal=c=>c.last_seen?(Date.now()-new Date(c.last_seen))/60000:Infinity
const online=c=>sinal(c)<ONLINE_MIN
const vendo=c=>!!c.watching&&sinal(c)<PLAY_MIN
/** dizia estar assistindo, mas parou de dar sinal: provavelmente desligou sem avisar */
const mudo=c=>!!c.watching&&online(c)&&!vendo(c)
const estado=c=>!c.device_tag?'novo':vendo(c)?'play':online(c)?'on':'off'
const EST={play:'Assistindo',on:'Online',off:'Offline',novo:'Aguardando ativação'}
// início real do que está passando: a sessão aberta no histórico (sobrevive a pausa/atualização)
const desde=c=>{const r=(D.st?.codes?.[c.code]?.recent||[]).find(x=>x.on&&x.t===c.watching);return r?r.at:c.watching_since}
function agoraDe(c){const e=estado(c)
 if(e==='play')return{t:c.watching,s:(KNAME[c.watching_kind]||'Vídeo')+(desde(c)?' · há '+tm((Date.now()-new Date(desde(c)))/60000):'')}
 if(e==='on')return mudo(c)?{t:'Parou de dar sinal',s:'Estava em: '+c.watching+'. Pausou ou desligou.'}:{t:'No menu do app',s:'Ligado, mas sem vídeo tocando'}
 if(e==='off')return{t:'Desligado ou sem internet',s:'Último sinal '+ago(c.last_seen)}
 return{t:'Código ainda não usado',s:'Criado '+ago(c.created_at)}}

/* ---------- situação do cliente ---------- */
const sit=c=>{const d=days(c.expires_at);return !c.active?'off':d<0?'venc':d<=7?'breve':'ok'}
function sitTag(c){const d=days(c.expires_at)
 if(!c.active)return['bad','Desligado']
 if(d<0)return['bad','Vencido']

const vencTxt=c=>{const d=days(c.expires_at);return d<0?'venceu há '+pl(-d,'dia','dias'):d===0?'vence hoje':'em '+pl(d,'dia','dias')}
const ini=s=>s.replace(/\(.*?\)/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()
const hueOf=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return h}
const avatar=(c,lg)=>`<span class="av${lg?' lg':''}" style="--h:${hueOf(c.name)}">${esc(ini(c.name))}</span>`

/* ---------- Proteção: o app é o original? ---------- */
// reconhece sozinho: Android pela assinatura do APK; site/iPad/iPhone e Windows pelo endereço de onde o app fala
const ORIGEM={web:'https://munizflix.vercel.app',windows:'app://munizflix'}
function appTipo(k){
 if(!k.device_tag)return''
 if(k.app_plat==='android')return k.app_sig&&D.cfg&&k.app_sig===D.cfg.sig_ok?'ok':'falso'
 if(k.app_plat==='web'||k.app_plat==='windows'){if(k.app_origin!==ORIGEM[k.app_plat])return'falso';return k.app_plat==='web'?'web':'win'}
 return'antigo'}
const APPT={ok:['ok','tv','App oficial (Android)'],falso:['bad','alert','App copiado'],web:['ok','globe','Site / iPad / iPhone'],win:['ok','monitor','App do Windows'],antigo:['warn','clock','Precisa atualizar o app']}
// cópias: aparelho ativo com app copiado + tentativas recusadas nos últimos 30 dias
function alertasCopia(){const m=new Map()
 for(const k of D.codes){if(k.device_tag&&k.active&&appTipo(k)==='falso')m.set(k.code,k)

/* ---------- Gráfico: horas assistidas por dia ---------- */
function ultimosDias(n){const l=[],d=new Date();d.setHours(12,0,0,0);for(let i=n-1;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);l.push(x)}return l}
const diaKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
const WD=['dom','seg','ter','qua','qui','sex','sáb']
// dias com registro (o histórico começou em D.st.since): não conta dias "vazios" de antes disso
function diasDesde(max){const s=D.st.since;if(!s)return max;const a=new Date(s+'T12:00:00'),b=new Date();b.setHours(12,0,0,0);return Math.max(1,Math.min(max,Math.round((b-a)/864e5)+1))}
function grafico(map){
 const ds=ultimosDias(Math.max(7,diasDesde(14))),vals=ds.map(d=>(map[diaKey(d)]||0)/60),mx=Math.max(1,...vals)
 const step=mx<=2?.5:mx<=5?1:mx<=12?2:mx<=30?5:10,teto=Math.ceil(mx/step)*step
 const W=640,H=200,L=34,B=24,T=8,cw=(W-L)/ds.length,bw=Math.min(26,cw*.62),ys=v=>T+(H-T-B)*(1-v/teto)
 let g=''
 for(let v=0;v<=teto+1e-9;v+=step)g+=`<line class="gl" x1="${L}" x2="${W}" y1="${ys(v)}" y2="${ys(v)}"/><text class="ax" x="${L-8}" y="${ys(v)+4}" text-anchor="end">${v.toLocaleString('pt-BR')}h</text>`
 ds.forEach((d,i)=>{const v=vals[i],x=L+i*cw+(cw-bw)/2,y=ys(v),h=Math.max(0,H-B-y),last=i===ds.length-1
  const r=Math.min(4,h/2),path=h<=0?'':`M${x},${H-B} V${y+r} Q${x},${y} ${x+r},${y} H${x+bw-r} Q${x+bw},${y} ${x+bw},${y+r} V${H-B} Z`
  g+=`<g data-i="${i}"><rect class="hit" x="${L+i*cw}" y="${T}" width="${cw}" height="${H-T}"/>${path?`<path class="bar${last?' today':''}" d="${path}"/>`:''}</g>`
  if(ds.length<=7||i%2===ds.length%2||last)g+=`<text class="ax" x="${L+i*cw+cw/2}" y="${H-6}" text-anchor="middle">${last?'hoje':d.getDate()+'/'+(d.getMonth()+1)}</text>`})
 setTimeout(()=>{const el=document.querySelector('#chartH');if(!el)return;const tip=el.querySelector('.tip')
  el.querySelectorAll('g[data-i]').forEach(gr=>{gr.onmouseenter=gr.ontouchstart=()=>{const i=+gr.dataset.i,d=ds[i],r=gr.querySelector('rect').getBoundingClientRect(),b=el.getBoundingClientRect()
    tip.innerHTML=`${tm(vals[i]*60)}<small>${WD[d.getDay()]}, ${d.toLocaleDateString('pt-BR')}</small>`;tip.style.left=(r.left-b.left+r.width/2)+'px';tip.style.top=(Math.max(ys(vals[i]),T)/H*el.querySelector('svg').getBoundingClientRect().height-6)+'px';tip.classList.remove('hide')}
   gr.onmouseleave=()=>tip.classList.add('hide')})},0)
 return `<div class="chart" id="chartH"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Horas assistidas por dia">${g}</svg><div class="tip hide"></div></div>`}
function spark(map){const ds=ultimosDias(14),v=ds.map(d=>map?.[diaKey(d)]||0),mx=Math.max(1,...v)
 return `<div class="spark" title="Últimos 14 dias">${v.map((x,i)=>`<i class="${x?'':'z'}${i===13&&x?' today':''}" style="height:${x?Math.max(8,Math.round(x/mx*100)):6}%" title="${ds[i].toLocaleDateString('pt-BR')}: ${tm(x)}"></i>`).join('')}</div>`}

function pixMes(){const m=new Date();m.setDate(1);m.setHours(0,0,0,0)
 const l=D.pays.filter(x=>x.status==='paid'&&new Date(x.paid_at||x.created_at)>=m);return{n:l.length,v:l.reduce((s,x)=>s+Number(x.amount||0),0)}}

  const l=D.pays.filter(x=>{if(x.status!=='paid')return false;const t=new Date(x.paid_at||x.created_at);return t>=a&&t<b})
  out.push({a,v:l.reduce((s,x)=>s+Number(x.amount||0),0)})}
 return out}

/* Servidores de IPTV: um cartão por assinatura (nome, vencimento, custo, endereços, usuário e senha).
 * Servidor 1 = servers/username/password + server_info{name,exp,cost}; os outros = itens de extra {url,urls,user,pass,name,exp,cost}.
 * SV é a cópia que está sendo editada na tela (k = posição em extra no banco; -1 = ainda não salvo). */
let SV=null,svAt=null
const PONTES=['https://munizflix-ponte.munizflix.workers.dev','https://munizflix.vercel.app/api/ponte']
/* res = logins reserva do MESMO fornecedor do servidor (mesmo catálogo): o app usa quando o mesmo título já toca em outra tela */
const resDe=l=>(l||[]).map(r=>({txt:[r.url,...(r.urls||[])].filter(Boolean).join('\n'),user:r.user||'',pass:r.pass||'',name:r.name||'',exp:r.exp||'',cost:r.cost??''}))
function svDe(g){const si=g.server_info||{}
 return[{main:true,k:-1,txt:(g.servers||[]).join('\n'),user:g.username||'',pass:g.password||'',name:si.name||'',exp:si.exp||'',cost:si.cost??'',res:resDe(si.res)},
  ...(g.extra||[]).map((x,k)=>({k,txt:[x.url,...(x.urls||[])].filter(Boolean).join('\n'),user:x.user||'',pass:x.pass||'',name:x.name||'',exp:x.exp||'',cost:x.cost??'',res:resDe(x.res)})),
  /* fora = reserva de OUTRO fornecedor (app_config.reserves, ex.: P2 LIVE): catálogo próprio, o app acha o título pelo nome e ano. Entra por último. */
  ...(g.reserves||[]).map((x,k)=>({fora:true,k,keep:x,txt:[x.url,...(x.urls||[])].filter(Boolean).join('\n'),user:x.user||'',pass:x.pass||'',name:x.name||'',exp:x.exp||'',cost:x.cost??'',res:[]}))]}
/** posição onde entra um servidor novo (antes das reservas de outro fornecedor) */
const fimSrv=()=>{const k=SV.findIndex(x=>x.fora);return k<0?SV.length:k}
const dLoc=s=>new Date(s+'T00:00:00')
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
const dBR=s=>s?dLoc(s).toLocaleDateString('pt-BR'):'—'
/** dias até o vencimento (data sem hora, como na loja: hoje 17/11 e vence 16/12 = 29 dias) */
const diasSrv=s=>{if(!s)return null;const h=new Date();h.setHours(0,0,0,0);return Math.round((dLoc(s)-h)/864e5)}
function svSelo(exp){const d=diasSrv(exp)
 if(d===null)return['','sem vencimento']
 if(d<0)return['bad','vencido há '+pl(-d,'dia','dias')]
 if(d===0)return['bad','vence hoje']
 return[d<=5?'warn':'ok',pl(d,'dia','dias')]}
function ajServidor(g){
 if(!SV||svAt!==g.updated_at){SV=svDe(g);svAt=g.updated_at}
 const olho=id=>`<button class="eye" type="button" onclick="const i=$('${id}');i.type=i.type==='password'?'text':'password'" aria-label="Mostrar senha">${ic('eye',17)}</button>`
 const total=SV.reduce((s,x)=>s+(Number(x.cost)||0)+(x.res||[]).reduce((a,r)=>a+(Number(r.cost)||0),0),0)
 const resHtml=(x,i)=>{const l=x.res||[]
  return `<p class="h">Outro login do <b>mesmo fornecedor</b> deste servidor. Quando o mesmo filme já está tocando em outra tela, o app usa o login reserva sozinho. Cada login reserva = mais telas assistindo o mesmo título.</p>
   ${l.map((r,j)=>{const[c,t]=svSelo(r.exp);return `<div class="svr" style="border:1px solid var(--line2);border-radius:12px;padding:10px;margin-top:10px">

     <label class="f">Senha<span class="pw"><input class="field" id="svr${i}_${j}" type="password" value="${esc(r.pass)}" oninput="SV[${i}].res[${j}].pass=this.value" autocomplete="new-password">${olho('svr'+i+'_'+j)}</span></label></div>
     <label class="f" style="margin-top:8px">Endereço(s), um por linha (vazio = os mesmos do servidor)<textarea class="field" rows="2" placeholder="http://..." oninput="SV[${i}].res[${j}].txt=this.value">${esc(r.txt)}</textarea></label>
     <div class="grid2" style="margin-top:8px"><label class="f">Por renovação<span class="money"><i>R$</i><input class="field" type="number" min="0" step="0.01" value="${esc(r.cost)}" placeholder="0,00" oninput="SV[${i}].res[${j}].cost=this.value"></span></label>
     <div style="align-self:end;text-align:right"><button class="btn bad sm" onclick="SV[${i}].res.splice(${j},1);render()">${ic('trash',15)}Tirar</button></div></div></div>`}).join('')}
   <button class="btn sm" style="margin-top:10px" onclick="(SV[${i}].res=SV[${i}].res||[]).push({txt:'',user:'',pass:'',name:'',exp:'',cost:''});render()">${ic('plus',15)}Adicionar login reserva</button>`}
 const card=(x,i)=>{const[c,t]=svSelo(x.exp),novo=x.k<0&&!x.main
   return `<div class="sv ${c}">
   <div class="svh"><span class="svi">${ic(x.fora?'users':'signal',20)}</span><div class="svt"><input class="pnm" value="${esc(x.name)}" placeholder="${x.main?'Nome (ex.: servidor principal)':x.fora?'Nome (ex.: P2 LIVE)':'Nome (ex.: AURA TV+)'}" maxlength="40" oninput="SV[${i}].name=this.value" aria-label="Nome do ${x.fora?'servidor reserva':'servidor '+(i+1)}"><small>${x.fora?'Reserva · catálogo próprio · entra por último':'Servidor '+(i+1)+' · '+(x.main?'principal':'soma ao catálogo')}</small></div><span class="tag ${c}">${t}</span></div>
   <div class="svf"><label class="f">Vencimento<input class="field" type="date" value="${esc(x.exp)}" onchange="SV[${i}].exp=this.value;render()"></label>
    <label class="f">Por renovação<span class="money"><i>R$</i><input class="field" type="number" min="0" step="0.01" value="${esc(x.cost)}" placeholder="0,00" oninput="SV[${i}].cost=this.value"></span></label></div>
   <div class="svb"><button class="btn ok sm" onclick="renovei(${i})">${ic('refresh',15)}Renovei +30 dias</button><button class="btn sm" onclick="conferirSrv(${i})" id="svc${i}">${ic('search',15)}Conferir no servidor</button></div>
   <p class="h svn">A nova validade conta a partir do vencimento atual. Vencido volta a valer a partir de hoje.</p>
   <details class="svd"${novo?' open':''}><summary>${ic('key',15)}Endereços, usuário e senha</summary>
    <label class="f">Endereço(s), um por linha<textarea class="field" rows="3" placeholder="http://..." oninput="SV[${i}].txt=this.value">${esc(x.txt)}</textarea></label>
    <p class="h" style="margin-top:6px">Com mais de um endereço, o app tenta o próximo sozinho quando o primeiro não responde.</p>
    <div class="grid2" style="margin-top:10px"><label class="f">Usuário<input class="field" value="${esc(x.user)}" oninput="SV[${i}].user=this.value" autocomplete="off"></label>
     <label class="f">Senha<span class="pw"><input class="field" id="svp${i}" type="password" value="${esc(x.pass)}" oninput="SV[${i}].pass=this.value" autocomplete="new-password">${olho('svp'+i)}</span></label></div>
    ${x.main?'':`<button class="btn bad sm" style="margin-top:12px" onclick="tirarSrv(${i})">${ic('trash',15)}Tirar ${x.fora?'esta reserva':'este servidor'}</button>`}</details>
   ${x.fora?'':`<details class="svd"><summary>${ic('users',15)}Logins reserva${(x.res||[]).length?' · '+(x.res||[]).length:''}</summary>${resHtml(x,i)}</details>`}</div>`}
 const nAss=SV.length+SV.reduce((a,x)=>a+(x.res||[]).length,0)
 return `<section class="box">${bxh('signal','Servidores de IPTV','As telas recebem estes dados ao abrir o app. O conteúdo de todos os servidores é somado (sem repetir títulos). Renovou um servidor? Toque em <b>Renovei +30 dias</b> no cartão dele.')}
  <div class="svs">${SV.map((x,i)=>x.fora?'':card(x,i)).join('')}
   <button class="sv add" onclick="SV.splice(fimSrv(),0,{k:-1,txt:'',user:'',pass:'',name:'',exp:'',cost:'',res:[]});render()">${ic('plus',22)}<span>Adicionar servidor</span></button></div>
  <h3 style="margin:22px 0 4px;font-size:15px">Reserva de outro fornecedor</h3>
  <p class="h" style="margin-bottom:12px">Usada <b>por último</b>: quando todos os servidores e logins reserva acima recusarem o filme (ele já está tocando em outras telas), o app procura o mesmo título nesta reserva, pelo nome e ano, e troca sozinho. Ela não aparece no catálogo do app.
   <br>Lista de títulos da reserva: ${g.reserves_at?'atualizada em <b>'+dth(g.reserves_at)+'</b>':'<b>ainda não montada</b>'} · atualiza sozinha todo dia às 5h. <button class="btn sm" id="rvIdx" style="margin-left:6px" onclick="atualizarIndice()">${ic('refresh',15)}Atualizar agora</button></p>
  <div class="svs">${SV.map((x,i)=>x.fora?card(x,i):'').join('')}
   <button class="sv add" onclick="SV.push({fora:true,k:-1,keep:{},txt:'',user:'',pass:'',name:'',exp:'',cost:'',res:[]});render()">${ic('plus',22)}<span>Adicionar reserva</span></button></div>
  <div class="bxf"><span class="h">${total?`Custo: <b>${brl(total)}</b> a cada renovação (${pl(nAss,'assinatura','assinaturas')})`:''}${g.updated_at?(total?' · ':'')+'Última alteração: '+dth(g.updated_at):''}</span><button class="btn pri" onclick="salvarServidor()">Salvar servidores</button></div>
  <p class="note">Para saber se cada servidor está respondendo, abra o app e veja em Perfil → Servidores (bolinha verde, amarela ou vermelha).</p></section>`}
async function tirarSrv(i){const x=SV[i]
 if(x.fora){if(!await confirmar({t:'Tirar a reserva '+(x.name||'')+'?',m:'O app deixa de usar esta reserva depois que você tocar em Salvar servidores.',ok:'Tirar',perigo:true,icone:'trash'}))return
  SV.splice(i,1);return render()}
 if(!await confirmar({t:'Tirar o servidor '+(i+1)+'?',m:`${x.name?x.name+': o':'O'} conteúdo dele sai do app de todos os clientes depois que você tocar em Salvar servidores.`,ok:'Tirar',perigo:true,icone:'trash'}))return
 SV.splice(i,1);render()}
/** Renovou a assinatura na loja: +30 dias a partir do vencimento atual (ou de hoje, se já venceu). Salva só o vencimento. */
async function renovei(i){const x=SV[i]
 if(!x.main&&x.k<0)return toast('Salve o servidor novo primeiro (Salvar servidores)',true)
 const h=new Date();h.setHours(0,0,0,0)
 const base=x.exp&&dLoc(x.exp)>=h?dLoc(x.exp):h,nv=new Date(base);nv.setDate(nv.getDate()+30)
 const nome=x.name||'Servidor '+(i+1)
 if(!await confirmar({t:'Renovou '+nome+'?',m:`O vencimento passa de ${dBR(x.exp)} para ${nv.toLocaleDateString('pt-BR')}.`,ok:'Sim, renovei',icone:'refresh'}))return
 salvarVenc(i,isoD(nv),'Renovado até '+nv.toLocaleDateString('pt-BR'))}
async function salvarVenc(i,exp,msg){const x=SV[i],g=D.cfg,up={updated_at:new Date().toISOString()}
 if(x.main)up.server_info={...(g.server_info||{}),exp}
 else if(x.fora){const rv=(g.reserves||[]).map(e=>({...e}));if(!rv[x.k])return toast('Salve os servidores primeiro',true);rv[x.k].exp=exp;up.reserves=rv}
 else{const ex=(g.extra||[]).map(e=>({...e}));if(!ex[x.k])return toast('Salve os servidores primeiro',true);ex[x.k].exp=exp;up.extra=ex}
 const r=await sb.from('app_config').update(up).eq('id',1)
 if(r.error)return erro(r.error)
 Object.assign(g,up);svAt=g.updated_at;x.exp=exp;toast(msg);render()}
/** Pergunta ao próprio servidor (pela ponte) até quando a assinatura vale. Só funciona com servidor já salvo. */
async function conferirSrv(i){const x=SV[i],urls=x.txt.split('\n').map(s=>s.trim().replace(/\/+$/,'')).filter(Boolean),b=$('svc'+i)
 if(!urls.length||!x.user||!x.pass)return toast('Preencha endereço, usuário e senha',true)
 b.disabled=true;b.lastChild.textContent='Conferindo...'
 let info=null
 achar:for(const u of urls)for(const p of PONTES){
  try{const ac=new AbortController(),t=setTimeout(()=>ac.abort(),15000)
   const r=await fetch(p+'/x?u='+encodeURIComponent(u+'/player_api.php?username='+encodeURIComponent(x.user)+'&password='+encodeURIComponent(x.pass)),{signal:ac.signal})
   clearTimeout(t)
   if(r.status===403){info={proibido:true};continue achar}
   if(!r.ok)continue
   const j=await r.json();if(j?.user_info){info=j.user_info;break achar}}catch{/* tenta a próxima */}}
 b.disabled=false;b.lastChild.textContent='Conferir no servidor'
 if(!info)return toast('O servidor não respondeu. Tente de novo daqui a pouco.',true)

  const o=Math.min(80,Math.max(0,parseFloat($('po'+i).value)||0)),t=$('pt'+i).value.trim();if(ps.some(x=>x.m===m))continue
  ps.push(t?{m,off:o,tag:t}:{m,off:o})}
 if(!ps.some(x=>x.m===1))ps.unshift({m:1,off:0})
 ps.sort((a,b)=>a.m-b.m)
 const t=$('prT').value.trim(),promo=t?{title:t,text:$('prX').value.trim()||undefined,until:$('prU').value||undefined}:null

async function salvarServidor(){
 const ls=[]
 const rv=[]
 for(let i=0;i<SV.length;i++){const x=SV[i],n=(x.fora?'servidor reserva':'servidor '+(i+1))+(x.name?' ('+x.name+')':'')
  const urls=x.txt.split('\n').map(s=>s.trim().replace(/\/+$/,'')).filter(Boolean)
  if(!x.main&&!urls.length&&!x.user&&!x.pass)continue // cartão novo deixado em branco
  if(!urls.length||!urls.every(s=>/^https?:\/\/\S+$/.test(s)))return toast('Endereço inválido no '+n+' (use http://...)',true)
  if(!x.user.trim()||!x.pass)return toast('Informe usuário e senha do '+n,true)
  const c=x.cost===''||x.cost==null?undefined:Math.max(0,Number(x.cost)||0)
  const res=[]
  for(const [j,r] of (x.res||[]).entries()){const ru=r.txt.split('\n').map(s=>s.trim().replace(/\/+$/,'')).filter(Boolean),nr='login reserva '+(j+1)+' do '+n
   if(!ru.length&&!r.user&&!r.pass)continue // reserva nova deixada em branco
   if(!ru.every(s=>/^https?:\/\/\S+$/.test(s)))return toast('Endereço inválido no '+nr+' (use http://...)',true)
   if(!r.user.trim()||!r.pass)return toast('Informe usuário e senha do '+nr,true)
   const u=ru.length?ru:urls,o={url:u[0],user:r.user.trim(),pass:r.pass};if(u.length>1)o.urls=u.slice(1)
   if(r.name.trim())o.name=r.name.trim();if(r.exp)o.exp=r.exp;if(r.cost!==''&&r.cost!=null)o.cost=Math.max(0,Number(r.cost)||0);res.push(o)}
  if(x.fora){const o={...(x.keep||{}),url:urls[0],user:x.user.trim(),pass:x.pass};delete o.urls;delete o.name;delete o.exp;delete o.cost
   if(urls.length>1)o.urls=urls.slice(1);if(x.name.trim())o.name=x.name.trim();if(x.exp)o.exp=x.exp;if(c!==undefined)o.cost=c;rv.push(o);continue}
  ls.push({main:!!x.main,urls,user:x.user.trim(),pass:x.pass,name:x.name.trim()||undefined,exp:x.exp||undefined,cost:c,res})}
 const[m,...ex]=ls
 const extra=ex.map(x=>{const o={url:x.urls[0],user:x.user,pass:x.pass};if(x.urls.length>1)o.urls=x.urls.slice(1)
  if(x.name)o.name=x.name;if(x.exp)o.exp=x.exp;if(x.cost!==undefined)o.cost=x.cost;if(x.res.length)o.res=x.res;return o})
 const server_info={};if(m.name)server_info.name=m.name;if(m.exp)server_info.exp=m.exp;if(m.cost!==undefined)server_info.cost=m.cost;if(m.res.length)server_info.res=m.res
 if(!await confirmar({t:'Salvar '+pl(ls.length,'servidor','servidores')+(rv.length?' e '+pl(rv.length,'reserva','reservas'):'')+'?',m:'Todos os aparelhos passam a usar estes dados na próxima vez que abrirem o app. Se algo estiver errado, ninguém consegue assistir.',ok:'Salvar servidores',icone:'signal'}))return
 // login/endereço da reserva de fora mudou: a lista de títulos dela precisa ser montada de novo
 const chaveRv=l=>JSON.stringify((l||[]).map(e=>[e.url,e.urls||[],e.user,e.pass]))
 const mudouRv=chaveRv(rv)!==chaveRv(D.cfg?.reserves)
 const r=await sb.from('app_config').update({servers:m.urls,username:m.user,password:m.pass,extra,server_info,reserves:rv,updated_at:new Date().toISOString()}).eq('id',1)
 if(r.error)return erro(r.error);SV=null;toast('Servidores salvos');if(mudouRv&&rv.length)atualizarIndice(true);carregar()}

 if(!await confirmar({t:`Excluir o código ${code}?`,m:'O aparelho para de funcionar. Não dá para desfazer.',ok:'Excluir',perigo:true,icone:'trash'}))return
 const r=await sb.from('codes').delete().eq('code',code);if(r.error)return erro(r.error);if(sheet?.t==='tela'&&sheet.id===code)fecharSheet();toast('Código excluído');carregar()}

function enviar(code){const k=D.codes.find(x=>x.code===code),c=D.clients.find(x=>x.id===k?.client_id)
 const txt=`Olá${c?', '+c.name:''}! Seu acesso ao *MunizFlix* está pronto.\n\nSeu código: *${code}*\n(vale para 1 aparelho)\n\nComo instalar:\n• TV: abra o app Downloader e digite ${LINKS.dl}\n• Celular Android: ${LINKS.cel}\n• Computador: ${LINKS.pc}\n• iPhone ou iPad: abra ${SITE} no Safari\n\nDepois é só abrir o MunizFlix e digitar o código.\n\nQuer escolher filmes e canais pelo celular? Abra ${CTRL} e use o mesmo código.`
 dlgRes=null
 dialogo(`<h3>Enviar o código ${code}</h3><p class="dm">Mensagem pronta com o código e os links de instalação. Pode mudar o texto antes de enviar.</p>
  <label class="f"><textarea class="field" id="eT" rows="13">${esc(txt)}</textarea></label>
  <div class="drow"><button class="btn" onclick="fechar()">Fechar</button><button class="btn" onclick="copiarTxt($('eT').value,'Mensagem copiada')">${ic('copy',16)}Copiar</button>
  <button class="btn pri" onclick="window.open(wa('${c?.phone||''}',$('eT').value),'_blank')">${ic('chat',17)}Abrir WhatsApp</button></div>`,'wide')}

/* ---------- Início ---------- */
let timer
async function iniciar(){
 const{data:{session}}=await sb.auth.getSession()
 ;['vLogin','vNoAdmin','vApp'].forEach(v=>$(v).classList.add('hide'))
 if(!session){$('vLogin').classList.remove('hide');return}
 const{data:adm}=await sb.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle()
 if(!adm){$('naId').textContent=session.user.id;$('vNoAdmin').classList.remove('hide');return}
 $('btnBusca').innerHTML=ic('search',17)+'<span>Buscar cliente, código ou tela</span><kbd>Ctrl K</kbd>'
 $('btnUpd').innerHTML=ic('refresh',18);$('btnNovo').innerHTML=ic('plus',18)+'<span>Novo cliente</span>'
 $('vApp').classList.remove('hide');$('page').classList.add('enter');await carregar()
 // não atualiza no meio de uma digitação nem com janela aberta (ver ocupado())
 clearInterval(timer);timer=setInterval(pulso,10000)}
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&!$('vApp').classList.contains('hide')){e.preventDefault();buscar()}
 else if(e.key==='Escape'){if($('modal').innerHTML)fechar();else if(sheet)fecharSheet()}
 else if(e.key==='Enter'&&e.target.matches?.('.at,.kpi.click')){e.target.click()}})
// voltou para o painel (outra aba, ou do controle pelo botão "voltar"): atualiza na hora
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('vApp').classList.contains('hide'))pulso()})
window.addEventListener('pageshow',e=>{if(e.persisted&&!$('vApp').classList.contains('hide'))carregar({quieto:true})})
iniciar()
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})
</script>
