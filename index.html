<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070f">
<meta name="robots" content="noindex,nofollow">
<title>Painel MunizFlix</title>
<link rel="icon" href="mark.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel MF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
/* Painel MunizFlix — versão 2 (2026-11): Início, Ao vivo, Clientes, Financeiro, Avisos, Proteção, Ajustes */
:root{--bg:#08070f;--bg2:#0d0b19;--card:#131022;--card2:#1a1630;--card3:#241e40;--line:rgba(160,130,255,.14);--line2:rgba(255,255,255,.07);
 --tx:#f4f1fb;--tx2:#c8c1de;--mut:#8d86a8;--acc:#a855f7;--grad:linear-gradient(135deg,#7c3aed,#c026d3);
 --ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--info:#60a5fa;--side:248px;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(80% 45% at 0% 0%,rgba(124,58,237,.14),transparent 60%),radial-gradient(60% 40% at 100% 100%,rgba(192,38,211,.08),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
a{color:inherit;text-decoration:none}
.hide{display:none!important}
.sp{flex:1}
.i{flex:none;display:block}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
::selection{background:rgba(168,85,247,.4)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:99px;border:2px solid transparent;background-clip:padding-box}

/* ---------- botões, campos, etiquetas ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14px;background:var(--card2);border:1px solid var(--line2);color:var(--tx);white-space:nowrap;transition:transform .12s,filter .15s,background .15s}
.btn:hover{background:var(--card3)}.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 10px 26px -12px rgba(192,38,211,.9)}.btn.pri:hover{filter:brightness(1.12)}
.btn.ok{color:var(--ok);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.09)}.btn.ok:hover{background:rgba(52,211,153,.16)}
.btn.bad{color:var(--bad);border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.08)}.btn.bad:hover{background:rgba(251,113,133,.16)}
.btn.solid.bad{background:#e11d48;color:#fff;border-color:transparent}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:6px}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:rgba(255,255,255,.07)}
.btn.ico{width:42px;padding:0}.btn.ico.sm{width:34px}
.btn.wide{width:100%}
.lnk{color:#c4b5fd;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}.lnk:hover{color:#e9d5ff}
.field,select.field,textarea.field{width:100%;height:44px;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:12px;padding:0 13px;font-size:15px;outline:none;transition:border-color .15s,background .15s}
textarea.field{height:auto;padding:11px 13px;line-height:1.5;resize:vertical}
.field:focus{border-color:var(--acc);background:rgba(168,85,247,.06)}
select.field option{background:#1a1630}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--tx2)}label.f>.field,label.f>span,label.f>textarea{margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--tx2);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:rgba(52,211,153,.32);background:rgba(52,211,153,.08)}
.tag.warn{color:var(--warn);border-color:rgba(251,191,36,.32);background:rgba(251,191,36,.08)}
.tag.bad{color:var(--bad);border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.08)}
.tag.info{color:var(--info);border-color:rgba(96,165,250,.32);background:rgba(96,165,250,.08)}
.code{font-family:ui-monospace,Consolas,monospace;font-weight:700;letter-spacing:.04em}
.h{font-size:13px;color:var(--mut);line-height:1.55}
.empty{padding:26px 16px;text-align:center;color:var(--mut);font-size:14px;border:1px dashed var(--line2);border-radius:14px}
.msg{font-size:13.5px;margin-top:10px;min-height:18px;color:var(--bad)}.msg.ok{color:var(--ok)}

/* estado de cada tela: assistindo (verde pulsando), online (azul), offline (cinza), aguardando (âmbar) */
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:#4b4563}
.dot.on{background:var(--info)}.dot.play{background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 1.8s infinite}.dot.novo{background:transparent;border:2px solid var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;padding:4px 11px 4px 9px;border-radius:99px;background:rgba(255,255,255,.05);color:var(--mut);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.play{color:var(--ok);background:rgba(52,211,153,.12)}.pill.play i{animation:pulse 1.8s infinite}
.pill.on{color:var(--info);background:rgba(96,165,250,.12)}.pill.novo{color:var(--warn);background:rgba(251,191,36,.1)}

/* ---------- estrutura ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);display:flex;flex-direction:column;gap:6px;padding:18px 12px 14px;background:rgba(13,11,25,.82);backdrop-filter:blur(18px);border-right:1px solid var(--line);z-index:30}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 16px;font-weight:900;font-size:19px;letter-spacing:-.02em}
.brand img{width:36px;height:36px;border-radius:11px}
.brand i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:10px;letter-spacing:.22em;color:var(--mut);font-weight:800;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--tx2);font-weight:700;font-size:14.5px;width:100%;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.05);color:var(--tx)}
.nav button.on{background:linear-gradient(90deg,rgba(124,58,237,.3),rgba(192,38,211,.1));color:#fff;box-shadow:inset 3px 0 0 #a855f7}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.08);color:var(--tx2);padding:2px 8px;border-radius:99px}
.nav .cnt.live{background:rgba(52,211,153,.15);color:var(--ok)}.nav .cnt.bad{background:#e11d48;color:#fff}.nav .cnt.warn{background:rgba(251,191,36,.16);color:var(--warn)}
.nav hr{border:0;border-top:1px solid var(--line2);margin:8px 10px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
.live{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--tx2);padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
.live.err{color:var(--bad)}.live.err i{background:var(--bad);animation:none}
.live small{color:var(--mut);font-weight:600;margin-left:auto}
.main{margin-left:var(--side);min-height:100vh}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 28px;background:rgba(8,7,15,.78);backdrop-filter:blur(16px);border-bottom:1px solid var(--line2)}
.top .brand{display:none;padding:0;font-size:17px}.top .brand img{width:30px;height:30px}
.srch{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--mut);font-size:14px;font-weight:500}
.srch{min-width:0}.srch span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch:hover{border-color:rgba(168,85,247,.45);color:var(--tx2)}
.srch kbd{margin-left:auto;flex:none;white-space:nowrap;font:inherit;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--mut)}
.wrap{padding:26px 28px 60px;max-width:1320px}
.wrap.enter>*{animation:up .38s cubic-bezier(.2,.7,.2,1) both}.wrap.enter>*:nth-child(2){animation-delay:.04s}.wrap.enter>*:nth-child(3){animation-delay:.08s}.wrap.enter>*:nth-child(4){animation-delay:.12s}.wrap.enter>*:nth-child(n+5){animation-delay:.16s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tabbar{display:none}
.pagehd{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.pagehd h1{font-size:26px;font-weight:900;letter-spacing:-.03em}
.pagehd p{color:var(--mut);font-size:14px;margin-top:4px}

/* ---------- blocos ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel>h2,.ph{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:800;margin-bottom:14px}
.ph .n,.panel>h2 .n{font-size:12px;color:var(--mut);font-weight:700}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
.cols.c16{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line2);min-width:0}
.row.click{cursor:pointer;transition:background .15s,border-color .15s}.row.click:hover{background:rgba(168,85,247,.08);border-color:rgba(168,85,247,.35)}
.row .k{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--tx2)}
.row .k.play{background:rgba(52,211,153,.14);color:var(--ok)}.row .k.bad{background:rgba(251,113,133,.14);color:var(--bad)}.row .k.warn{background:rgba(251,191,36,.14);color:var(--warn)}.row .k.ok{background:rgba(52,211,153,.14);color:var(--ok)}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.acts{display:flex;align-items:center;gap:8px;flex:none}
/* botão de excluir uma entrada do histórico (aparece fraco, fica vermelho no dedo em cima) */
.delx{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--mut);border:1px solid transparent;transition:color .15s,background .15s,border-color .15s}
.delx:hover,.delx:focus-visible{color:var(--bad);background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.3)}
.rank{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;background:rgba(168,85,247,.16);color:#d8b4fe}
.meter{height:4px;border-radius:99px;background:rgba(255,255,255,.06);margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;background:var(--grad);border-radius:99px}
.av{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 65% 46%),hsl(calc(var(--h) + 40) 70% 38%))}
.av.lg{width:54px;height:54px;border-radius:17px;font-size:19px}

/* Início */
.hello{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.hello h1{font-size:28px;font-weight:900;letter-spacing:-.03em}.hello p{color:var(--mut);margin-top:4px;font-size:14px}.hello p::first-letter{text-transform:uppercase}
.attn{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.at{display:flex;align-items:center;gap:13px;padding:14px;border-radius:16px;border:1px solid var(--line2);background:var(--card);cursor:pointer;transition:transform .15s,border-color .15s}
.at:hover{transform:translateY(-2px)}
.at .k{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.at b{display:block;font-size:14.5px}.at small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;line-height:1.4}
.at .go{margin-left:auto;color:var(--mut)}
.at.bad{border-color:rgba(251,113,133,.4);background:linear-gradient(135deg,rgba(251,113,133,.1),var(--card))}.at.bad .k{background:rgba(251,113,133,.16);color:var(--bad)}
.at.warn{border-color:rgba(251,191,36,.35);background:linear-gradient(135deg,rgba(251,191,36,.08),var(--card))}.at.warn .k{background:rgba(251,191,36,.15);color:var(--warn)}
.at.info{border-color:rgba(96,165,250,.3)}.at.info .k{background:rgba(96,165,250,.14);color:var(--info)}
.allok{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:14px;border:1px solid rgba(52,211,153,.28);background:rgba(52,211,153,.06);color:var(--ok);font-weight:700;font-size:14px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{position:relative;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);overflow:hidden}
.kpi.click{cursor:pointer;transition:transform .15s,border-color .15s}.kpi.click:hover{transform:translateY(-2px);border-color:rgba(168,85,247,.45)}
.kpi .kh{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--tx2)}
.kpi .kh span{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(168,85,247,.16);color:#d8b4fe}
.kpi b{display:block;font-size:29px;font-weight:900;letter-spacing:-.03em;margin-top:12px;font-variant-numeric:tabular-nums}
.kpi em{display:block;font-style:normal;color:var(--mut);font-size:12.5px;margin-top:3px}
.kpi.hl{background:linear-gradient(135deg,rgba(124,58,237,.34),rgba(192,38,211,.14) 70%,var(--card));border-color:rgba(168,85,247,.45)}
.kpi.hl .kh span{background:rgba(52,211,153,.18);color:var(--ok)}
.sum{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:8px}.sum b{display:block;font-size:19px;font-weight:800}.sum small{color:var(--mut);font-size:12px}
.chart{position:relative}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:rgba(255,255,255,.06);stroke-width:1}.chart .ax{fill:var(--mut);font-size:11px;font-weight:600}
.chart .bar{fill:#a855f7}.chart .bar.today{fill:#e879f9}.chart .hit{fill:transparent}.chart g:hover .bar{fill:#c084fc}
.tip{position:absolute;pointer-events:none;background:#231d36;border:1px solid rgba(168,85,247,.45);border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tip small{display:block;color:var(--mut);font-weight:600;font-size:11.5px}
.note{font-size:12px;color:var(--mut);margin-top:10px}

/* filtros */
.fil{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fil button{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line2);font-weight:700;font-size:13.5px;color:var(--tx2);transition:border-color .15s,background .15s}
.fil button b{font-size:13px;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--tx)}
.fil button:hover{border-color:rgba(168,85,247,.4)}
.fil button.on{background:rgba(168,85,247,.16);border-color:rgba(168,85,247,.55);color:#fff}
.fil .f-play b,.fil .f-ok b{color:var(--ok)}.fil .f-on b{color:var(--info)}.fil .f-novo b,.fil .f-breve b{color:var(--warn)}.fil .f-venc b{color:var(--bad)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .inp{flex:1;min-width:220px;position:relative}.bar .inp .i{position:absolute;left:13px;top:13px;color:var(--mut)}.bar .inp input{padding-left:40px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line2)}
.seg button{padding:7px 13px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mut)}.seg button.on{background:var(--card3);color:#fff}

/* Ao vivo: cartão de cada tela */
.grp{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2)}
.grp:first-of-type{margin-top:4px}.grp span{color:var(--mut);font-weight:700}.grp::after{content:"";flex:1;height:1px;background:var(--line2)}
.tvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tv{position:relative;display:flex;flex-direction:column;gap:10px;padding:15px;border-radius:var(--r);background:var(--card);border:1px solid var(--line2);cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;overflow:hidden}
.tv:hover{transform:translateY(-2px);border-color:rgba(168,85,247,.5);box-shadow:0 16px 40px -22px rgba(168,85,247,.7)}
.tv::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:#3a3552}
.tv.e-play{border-color:rgba(52,211,153,.35);background:linear-gradient(160deg,rgba(52,211,153,.08),var(--card) 55%)}.tv.e-play::before{background:var(--ok)}
.tv.e-on::before{background:var(--info)}.tv.e-novo::before{background:var(--warn)}
.tv.e-off{opacity:.78}.tv.desl{opacity:.6}
.tv header,.tv footer{display:flex;align-items:center;gap:8px}
.tv .sig{display:inline-flex;align-items:center;gap:4px;color:var(--mut);font-size:11.5px;font-weight:600}
.tv h3{font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv .who{color:var(--mut);font-size:13px;margin-top:-6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowb{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;background:rgba(255,255,255,.04);min-width:0;color:var(--tx2)}
.nowb>div{min-width:0}.nowb b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowb small{display:block;color:var(--mut);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowb.play{background:rgba(52,211,153,.1);color:var(--ok)}.nowb.play b{color:#fff}
.nowb.big{padding:15px}.nowb.big b{font-size:16.5px;white-space:normal}
.tv footer{color:var(--mut);font-size:12.5px}.tv .plat{display:inline-flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv .plat{flex:1 1 0}.tv .hoje{flex:none;white-space:nowrap}.tv .hoje b{color:var(--tx)}.tv footer .btn{flex:none}

/* Clientes */
.ctab{border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;overflow-y:hidden;background:var(--card)}
.chd,.crow{display:grid;grid-template-columns:minmax(210px,2.1fr) 150px minmax(110px,1fr) minmax(120px,1fr) 100px 150px;gap:12px;align-items:center;padding:12px 16px}
.chd{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);background:rgba(255,255,255,.03)}

.shb{flex:1;overflow-y:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:18px}

.codetag{flex:none;margin-left:auto;font-family:ui-monospace,Consolas,monospace;font-weight:900;font-size:26px;letter-spacing:.08em;color:#fff;padding:10px 20px;border-radius:14px;background:linear-gradient(135deg,#a855f7,#ec4899);box-shadow:0 0 20px rgba(168,85,247,.5),0 8px 24px -6px rgba(236,72,153,.6);text-shadow:0 2px 8px rgba(0,0,0,.4);white-space:nowrap;line-height:1}
.codebox{flex:none;margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 18px;border-radius:14px;background:linear-gradient(135deg,#a855f7,#ec4899);box-shadow:0 0 24px rgba(168,85,247,.55),0 8px 28px -6px rgba(236,72,153,.65);min-width:110px}
.codelbl{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7)}

.spark{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:10px}.spark i{flex:1;border-radius:3px;background:#a855f7;min-height:3px}.spark i.z{background:rgba(255,255,255,.08)}.spark i.today{background:#e879f9}
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:13.5px;padding:13px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line2)}

.venc div{flex:1;min-width:0}.venc small{display:block;color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.venc b{display:block;font-size:20px;font-weight:900;margin-top:2px}.venc em{display:block;font-style:normal;font-size:13px;color:var(--tx2);margin-top:1px}

.pal{padding:0;overflow:hidden;align-self:start;margin-top:8vh;width:min(600px,100%)}

.toast .i{color:var(--ok)}.toast.err{border-color:rgba(251,113,133,.55)}.toast.err .i{color:var(--bad)}

/* Financeiro */
.meses{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:6px}

function erro(e){console.error(e);toast('Não deu certo: '+(e?.message||e),true)}
let dlgRes=null
function dialogo(html,cls=''){$('modal').innerHTML=`<div class="ov" onclick="if(event.target===this)fechar()"><div class="dlg ${cls}" role="dialog" aria-modal="true">${html}</div></div>`
 const f=$('modal').querySelector('[autofocus]')||$('modal').querySelector('.btn.pri,.btn.solid');if(f)setTimeout(()=>f.focus(),30)}
function fechar(v){$('modal').innerHTML='';if(dlgRes){const r=dlgRes;dlgRes=null;r(v)}}
/** Pergunta "tem certeza?" dentro do painel (no lugar da caixinha do navegador). Devolve true/false. */
function confirmar({t,m,ok='Confirmar',perigo=false,icone}){return new Promise(res=>{fechar();dlgRes=v=>res(v===true)
 dialogo(`<div class="dic${perigo?' bad':''}">${ic(icone||(perigo?'alert':'check'),24)}</div><h3>${esc(t)}</h3>${m?`<p class="dm">${esc(m)}</p>`:''}
  <div class="drow"><button class="btn" onclick="fechar(false)">Cancelar</button><button class="btn ${perigo?'bad solid':'pri'}" onclick="fechar(true)">${esc(ok)}</button></div>`)})}
/** Pede um texto. Devolve o texto, ou null se cancelar. */
function perguntar({t,m,label,valor='',ph='',ok='Salvar'}){return new Promise(res=>{fechar();dlgRes=v=>res(typeof v==='string'?v:null)
 dialogo(`<h3>${esc(t)}</h3>${m?`<p class="dm">${esc(m)}</p>`:''}<label class="f">${esc(label||'')}<input class="field" id="dIn" autofocus value="${esc(valor)}" placeholder="${esc(ph)}" maxlength="60" onkeydown="if(event.key==='Enter')fechar(this.value)"></label>
  <div class="drow"><button class="btn" onclick="fechar()">Cancelar</button><button class="btn pri" onclick="fechar($('dIn').value)">${esc(ok)}</button></div>`)})}

  for(const r of [p,c,k,g])if(r.error)throw r.error
  D={plans:p.data,clients:c.data,codes:k.data,cfg:g.data,remotes:rm.error?[]:rm.data,pays:py.error?[]:py.data,nts:nn.error?[]:nn.data,st:st.error||!st.data?{codes:{},days:{},top:[]}:st.data,pico:pc.error||!pc.data?null:pc.data,atk:at.error||!Array.isArray(at.data)?[]:at.data}

const EST={play:'Assistindo',on:'Online',off:'Offline',novo:'Aguardando ativação'}

const desde=c=>{const r=(D.st?.codes?.[c.code]?.recent||[]).find(x=>x.on&&x.t===c.watching);return r?r.at:c.watching_since}

/** Teste = cliente que se desliga sozinho no fim do tempo; se pagar o Pix com o código, vira cliente normal */

const restaTxt=e=>{const m=Math.round((new Date(e)-Date.now())/60000),a=Math.abs(m),t=a<60?pl(a,'minuto','minutos'):a<48*60?pl(Math.round(a/60),'hora','horas'):pl(Math.round(a/1440),'dia','dias');return m>=0?'faltam '+t:'acabou há '+t}
const dtHm=e=>new Date(e).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
const limTelas=c=>c.peixe?99:c.teste?1:(plano(c.plan_id)?.screens||1)
function sitTag(c){const d=days(c.expires_at)
 if(!c.active)return['bad','Desligado']

 return d>SEM_PRAZO?'sem prazo':d<0?'venceu há '+pl(-d,'dia','dias'):d===0?'vence hoje':'em '+pl(d,'dia','dias')}

 if(k.app_plat==='web'||k.app_plat==='windows'){if(k.app_origin!==ORIGEM[k.app_plat])return'falso';return k.app_plat==='web'?'web':'win'}

 return[...m.values()]}

/* ---------- Gráfico: horas assistidas por dia ---------- */
function ultimosDias(n){const l=[],d=new Date();d.setHours(12,0,0,0);for(let i=n-1;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);l.push(x)}return l}
const diaKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
const WD=['dom','seg','ter','qua','qui','sex','sáb']
// dias com registro (o histórico começou em D.st.since): não conta dias "vazios" de antes disso
function diasDesde(max){const s=D.st.since;if(!s)return max;const a=new Date(s+'T12:00:00'),b=new Date();b.setHours(12,0,0,0);return Math.max(1,Math.min(max,Math.round((b-a)/864e5)+1))}
function grafico(map){
 const ds=ultimosDias(Math.max(7,diasDesde(14))),vals=ds.map(d=>(map[diaKey(d)]||0)/60),mx=Math.max(1,...vals)
 const step=mx<=2?.5:mx<=5?1:mx<=12?2:mx<=30?5:10,teto=Math.ceil(mx/step)*step
 const W=640,H=200,L=34,B=24,T=8,cw=(W-L)/ds.length,bw=Math.min(26,cw*.62),ys=v=>T+(H-T-B)*(1-v/teto)
 let g=''
 for(let v=0;v<=teto+1e-9;v+=step)g+=`<line class="gl" x1="${L}" x2="${W}" y1="${ys(v)}" y2="${ys(v)}"/><text class="ax" x="${L-8}" y="${ys(v)+4}" text-anchor="end">${v.toLocaleString('pt-BR')}h</text>`
 ds.forEach((d,i)=>{const v=vals[i],x=L+i*cw+(cw-bw)/2,y=ys(v),h=Math.max(0,H-B-y),last=i===ds.length-1
  const r=Math.min(4,h/2),path=h<=0?'':`M${x},${H-B} V${y+r} Q${x},${y} ${x+r},${y} H${x+bw-r} Q${x+bw},${y} ${x+bw},${y+r} V${H-B} Z`
  g+=`<g data-i="${i}"><rect class="hit" x="${L+i*cw}" y="${T}" width="${cw}" height="${H-T}"/>${path?`<path class="bar${last?' today':''}" d="${path}"/>`:''}</g>`
  if(ds.length<=7||i%2===ds.length%2||last)g+=`<text class="ax" x="${L+i*cw+cw/2}" y="${H-6}" text-anchor="middle">${last?'hoje':d.getDate()+'/'+(d.getMonth()+1)}</text>`})
 setTimeout(()=>{const el=document.querySelector('#chartH');if(!el)return;const tip=el.querySelector('.tip')
  el.querySelectorAll('g[data-i]').forEach(gr=>{gr.onmouseenter=gr.ontouchstart=()=>{const i=+gr.dataset.i,d=ds[i],r=gr.querySelector('rect').getBoundingClientRect(),b=el.getBoundingClientRect()
    tip.innerHTML=`${tm(vals[i]*60)}<small>${WD[d.getDay()]}, ${d.toLocaleDateString('pt-BR')}</small>`;tip.style.left=(r.left-b.left+r.width/2)+'px';tip.style.top=(Math.max(ys(vals[i]),T)/H*el.querySelector('svg').getBoundingClientRect().height-6)+'px';tip.classList.remove('hide')}
   gr.onmouseleave=()=>tip.classList.add('hide')})},0)
 return `<div class="chart" id="chartH"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Horas assistidas por dia">${g}</svg><div class="tip hide"></div></div>`}
function spark(map){const ds=ultimosDias(14),v=ds.map(d=>map?.[diaKey(d)]||0),mx=Math.max(1,...v)
 return `<div class="spark" title="Últimos 14 dias">${v.map((x,i)=>`<i class="${x?'':'z'}${i===13&&x?' today':''}" style="height:${x?Math.max(8,Math.round(x/mx*100)):6}%" title="${ds[i].toLocaleDateString('pt-BR')}: ${tm(x)}"></i>`).join('')}</div>`}

function pendencias(){const l=[],nomes=(a,n=3)=>a.slice(0,n).map(c=>c.name).join(', ')+(a.length>n?' e mais '+(a.length-n):'')
 const venc=D.clients.filter(c=>sit(c)==='venc'),breve=D.clients.filter(c=>sit(c)==='breve'),cop=alertasCopia(),atq=D.atk||[]
 const novos=D.codes.filter(k=>!k.device_tag&&k.active&&Date.now()-new Date(k.created_at)>864e5)
 if(cop.length)l.push(['bad','shield',pl(cop.length,'aparelho com app copiado','aparelhos com app copiado'),'Alguém usou uma cópia do MunizFlix com um código seu.',"ir('protecao')"])
 // tentativas erradas de ativação: o banco já limita por código e por internet; aqui é só o aviso
 if(atq.length)l.push(['bad','shield',pl(atq.length,'código com erros de ativação','códigos com erros de ativação'),'Alguém está tentando adivinhar códigos. Toque para ver de onde vêm.','verAtaques()'])
 // trava automática da proteção contra cópia: desligou sozinha (muitos aparelhos recusados de uma vez)
 const aa=D.cfg&&D.cfg.sig_auto_off_at?new Date(D.cfg.sig_auto_off_at).getTime():0
 if(aa&&!D.cfg.sig_enforce&&Date.now()-aa<7*864e5)l.push(['bad','shield','A proteção contra cópia se desligou sozinha','Aconteceu em '+dth(D.cfg.sig_auto_off_at)+': muitos aparelhos foram recusados de uma vez. Confira antes de ligar de novo.',"ir('protecao')"])
 if(venc.length)l.push(['bad','alert',pl(venc.length,'cliente vencido','clientes vencidos'),nomes(venc),"ir('financeiro')"])
 if(breve.length)l.push(['warn','cal',pl(breve.length,'cliente vence','clientes vencem')+' em até 7 dias',nomes(breve),"ir('financeiro')"])
 // servidores de IPTV vencidos ou vencendo em até 5 dias (nome e vencimento cadastrados em Ajustes → Servidores)
 const g=D.cfg||{},srv=[{...(g.server_info||{}),n:1},...(g.extra||[]).map((x,k)=>({...x,n:k+2}))].filter(x=>x.exp)

 ;lig(g.reserves).forEach((r,j)=>add(r.name||'Reserva '+(j+1),Math.max(1,Number(r.conns)||1),'fora'))

/* ---------- Financeiro (Pix pelo Mercado Pago) ---------- */
const PAYURL=code=>SITE+'/pagar?c='+code
const PST={paid:['ok','Pago'],pending:['warn','Aguardando'],expired:['','Expirado'],canceled:['','Cancelado'],failed:['bad','Falhou'],refunded:['bad','Devolvido'],charged_back:['bad','Contestado']}
function pixMes(){const m=new Date();m.setDate(1);m.setHours(0,0,0,0)
 const l=D.pays.filter(x=>x.status==='paid'&&new Date(x.paid_at||x.created_at)>=m);return{n:l.length,v:l.reduce((s,x)=>s+Number(x.amount||0),0)}}
function receitaMeses(n){const out=[],h=new Date()
 for(let i=n-1;i>=0;i--){const a=new Date(h.getFullYear(),h.getMonth()-i,1),b=new Date(h.getFullYear(),h.getMonth()-i+1,1)
  const l=D.pays.filter(x=>{if(x.status!=='paid')return false;const t=new Date(x.paid_at||x.created_at);return t>=a&&t<b})
  out.push({a,v:l.reduce((s,x)=>s+Number(x.amount||0),0)})}
 return out}
/** Exclui uma entrada do histórico de Pix (pagamento de teste, cobrança errada).
 * Apaga só o registro: o dinheiro não volta por aqui (reembolso é no painel da Cakto) e o vencimento
 * do cliente não muda — apagar histórico não desfaz o acesso que ele já ganhou. */
async function apagarPix(id){
 const x=D.pays.find(y=>y.id===id);if(!x)return
 const c=D.clients.find(y=>y.id===x.client_id),pago=x.status==='paid'
 const m=`${c?.name||'Cliente apagado'} · ${brl(x.amount)} · ${dth(x.paid_at||x.created_at)}. `
  +(pago?'Era um Pix PAGO: sai do histórico e das estatísticas. O dinheiro não volta por aqui — para devolver, o reembolso é no painel da Cakto.':'Esse Pix não foi pago: sai do histórico e das estatísticas.')
  +' O acesso que o cliente já ganhou continua como está.'
 if(!await confirmar({t:'Excluir este pagamento?',m,ok:'Excluir',perigo:true,icone:'trash'}))return
 const r=await sb.rpc('admin_apagar_pagamentos',{p_ids:[id]})
 if(r.error)return erro(r.error)
 if(!r.data)return toast('O banco não apagou esta entrada. Avise o suporte.',true)
 toast('Pagamento excluído');carregar()
}
function linhaPix(x,ficha){const[cl,t]=PST[x.status]||['',x.status],c=D.clients.find(y=>y.id===x.client_id)
 // só o id vai no onclick: nome de cliente com apóstrofo não quebra o botão
 const del=`<button class="delx" title="Excluir do histórico" aria-label="Excluir este pagamento do histórico" onclick="event.stopPropagation();apagarPix('${x.id}')">${ic('trash',16)}</button>`
 if(ficha===true)return `<div class="row"><div class="k ${x.status==='paid'?'ok':x.status==='pending'?'warn':''}">${ic(x.status==='paid'?'check':x.status==='pending'?'clock':'x',17)}</div>
  <div class="t"><b>${dth(x.paid_at||x.created_at)}</b><small>${x.new_expires_at?'renovou até '+dt(x.new_expires_at):'Pix gerado no app'}${x.note?' · '+esc(x.note):''}</small></div><span class="v">${brl(x.amount)}</span><span class="tag ${cl}">${t}</span>${del}</div>`
 return `<div class="row${c?' click':''}"${c?` onclick="abrir('cli','${c.id}')"`:''}><div class="k ${x.status==='paid'?'ok':x.status==='pending'?'warn':''}">${ic(x.status==='paid'?'check':x.status==='pending'?'clock':'x',17)}</div>
  <div class="t"><b>${esc(c?.name||'Cliente apagado')}</b><small>${dth(x.paid_at||x.created_at)}${x.new_expires_at?' · renovou até '+dt(x.new_expires_at):''}${x.note?' · '+esc(x.note):''}</small></div><span class="v">${brl(x.amount)}</span><span class="tag ${cl}">${t}</span>${del}</div>`}
let pFiltro='todos'
function rFinanceiro(){
 const mes=pixMes(),pend=D.pays.filter(x=>x.status==='pending').length
 const tot=D.pays.filter(x=>x.status==='paid').reduce((s,x)=>s+Number(x.amount||0),0)
 const ativos=D.clients.filter(c=>c.active&&pagante(c)&&days(c.expires_at)>=0),previsto=ativos.reduce((s,c)=>s+precoDe(c),0)
 const cobrarL=D.clients.filter(c=>c.active&&pagante(c)&&days(c.expires_at)<=7).sort((a,b)=>new Date(a.expires_at)-new Date(b.expires_at)),aReceber=cobrarL.reduce((s,c)=>s+precoDe(c),0)
 let l=D.pays;if(pFiltro==='pagos')l=l.filter(x=>x.status==='paid');else if(pFiltro==='outros')l=l.filter(x=>x.status!=='paid')
 const ms=receitaMeses(6),mx=Math.max(1,...ms.map(m=>m.v))

  <div class="kpi"><div class="kh"><span>${ic('clock',15)}</span>Pix aguardando</div><b>${pend}</b><em>gerados e ainda não pagos</em></div></div>
 <div class="cols c16">

      <button class="btn sm" onclick="event.stopPropagation();cobrar('${c.id}')" title="Mandar a cobrança com o link do Pix">${ic('chat',15)}Cobrar</button>
      <button class="btn sm ok" onclick="event.stopPropagation();renovar('${c.id}')">Renovar</button></span></div>`}).join('')+'</div>'
    :`<div class="empty">Ninguém para cobrar nos próximos 7 dias.</div>`}
   <p class="note">“Cobrar” abre o WhatsApp com a mensagem pronta e o link do Pix. “Renovar” é para quando o cliente pagou por fora (dinheiro, Pix direto).</p></div>
  <div class="panel"><div class="ph">${ic('chart',18)}Pix recebido por mês<span class="n">em reais</span></div>
   <div class="meses">${ms.map(m=>`<div><b>${m.v?brl(m.v).replace(/^R\$\s*/,'').replace(/,00$/,''):'—'}</b><i style="height:${Math.round(m.v/mx*100)}%"></i><small>${m.a.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}</small></div>`).join('')}</div>
   <p class="note">Total recebido por Pix desde o início: <b style="color:var(--tx)">${brl(tot)}</b></p></div></div>
 <div class="panel" style="margin-top:16px"><div class="ph">${ic('card',18)}Histórico de Pix<span class="sp"></span>
  <span class="seg">${[['todos','Todos'],['pagos','Pagos'],['outros','Outros']].map(([k,t])=>`<button class="${pFiltro===k?'on':''}" onclick="pFiltro='${k}';render()">${t}</button>`).join('')}</span></div>
  ${l.length?'<div class="list">'+l.slice(0,80).map(x=>linhaPix(x)).join('')+'</div>'+(l.length>80?`<p class="note">Mostrando os 80 mais recentes de ${l.length}.</p>`:'')
  :'<div class="empty">Nenhum pagamento aqui ainda.</div>'}</div>`}

 ['venc','Vence em breve','pay','Sua assinatura está acabando','Renove agora pelo Pix, aqui mesmo no app: é só tocar em Renovar agora. Pagando por 3, 6 ou 12 meses você ganha desconto.'],
 ['venceu','Venceu','pay','Sua assinatura venceu','Para voltar a assistir, renove pelo Pix aqui no app. A liberação é na hora.'],
 ['manut','Manutenção','info','Manutenção rápida','Alguns canais podem ficar fora do ar por alguns minutos. Já estamos resolvendo. Obrigado pela paciência!'],
 ['novo','Novidade','info','Novidade no MunizFlix','Chegaram filmes e séries novos. Dá uma olhada na tela inicial!'],
 ['livre','Em branco','info','','']]
let av={alvo:'expiring',dias:5,cli:'',kind:'pay',mod:'venc',title:AVMOD[0][3],body:AVMOD[0][4],hq:''}
const avCli=()=>D.clients.find(c=>c.id===av.cli)
const avKind=()=>av.alvo==='expiring'||av.alvo==='expired'?'pay':av.alvo==='client'&&avCli()?.peixe?'info':av.kind
function alvoL(){const now=Date.now(),lim=now+av.dias*864e5,k=avKind()
 return D.clients.filter(c=>{if(c.peixe&&k==='pay')return false;const e=new Date(c.expires_at).getTime()
  return av.alvo==='client'?c.id===av.cli:av.alvo==='expiring'?c.active&&e<=lim&&e>now-30*864e5:av.alvo==='expired'?e<now&&e>now-60*864e5:c.active})}
function avPrev(){const t=$('pvT'),b=$('pvB');if(t)t.textContent=av.title||'Título do aviso';if(b)b.textContent=av.body}
function avModelo(k){const m=AVMOD.find(x=>x[0]===k);if(!m)return;av.mod=k;av.title=m[3];av.body=m[4];if(av.alvo==='client'||av.alvo==='all')av.kind=m[2]
 if(k==='venc'&&av.alvo!=='client')av.alvo='expiring';if(k==='venceu'&&av.alvo!=='client')av.alvo='expired';render()}
/** histórico: cada envio vira um grupo (mesmo título no mesmo minuto) com o nome de quem recebeu */
function avGrupos(){const g={},o=[]
 for(const n of D.nts){const k=n.title+'|'+n.created_at.slice(0,16);if(!g[k]){g[k]={k,t:n.title,b:n.body,at:n.created_at,kind:n.kind,ids:[],cs:[]};o.push(g[k])}
  g[k].ids.push(n.id);const c=D.clients.find(x=>x.id===n.client_id);g[k].cs.push(c?c.name:'Cliente apagado')}
 return o}

 const hist=avGrupos().filter(h=>!q||h.t.toLowerCase().includes(q)||h.cs.some(x=>x.toLowerCase().includes(q)))
 const cl=avCli(),ord=D.clients.slice().sort((a,b)=>a.name.localeCompare(b.name))
 const quem=n?L.slice(0,6).map(c=>esc(c.name)).join(', ')+(n>6?' e mais '+(n-6):''):''
 $('page').innerHTML=head('Avisos','Recado que aparece na tela da TV ou do celular do cliente. Só é enviado quando você manda daqui: o app não mostra mais lembrete sozinho.')+`

   ${av.alvo==='client'?`<label class="f" style="margin-top:12px">Cliente<select class="field" onchange="av.cli=this.value;render()"><option value="">Escolha o cliente…</option>${ord.map(c=>`<option value="${c.id}"${c.id===av.cli?' selected':''}>${esc(c.name)}${c.peixe?' 🐟':''} · ${esc(sitTag(c)[1])}</option>`).join('')}</select></label>`:''}

const isoDia=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}

/* ---------- Vencimento: uma conta só ----------
 * A regra do vencimento é do banco (`payment_apply`, usada pelo Pix do app): o período é somado ao que
 * ainda resta — base = o que for maior entre hoje e o vencimento atual — e termina 23:59:59 no horário
 * de Belém. O painel não inventa outra conta: mostra a prévia com esta função e manda renovar pela
 * função `admin_renovar`, que aplica a mesma regra e registra o pagamento no Financeiro.
 * 1 mês = 30 dias, igual ao Pix (é o que o app vende: 3 meses = 90 dias).
 */
const DIAS_MES=30
const SEM_PRAZO=365*5                       // vencimento a mais de 5 anos: mostra "sem prazo" (não "em 26.865 dias")
/** Fim do dia (23:59:59), como o banco grava. */
const fimDoDia=d=>{const x=new Date(d);x.setHours(23,59,59,0);return x}
/** Base de uma renovação: o que for maior entre agora e o vencimento atual. */
const baseDe=c=>Math.max(Date.now(),new Date(c?.expires_at||0).getTime())
/** Períodos à venda, iguais aos do app (Ajustes → Planos e preços → Períodos). */
function periodos(){
 const l=((D.cfg?.pay_periods)?.length?D.cfg.pay_periods:[{m:1,off:0}])
  .map(x=>({m:Number(x.m)||1,off:Number(x.off)||0,tag:x.tag||''})).filter(x=>x.m>=1).sort((a,b)=>a.m-b.m)
 return l.length?l:[{m:1,off:0,tag:''}]
}
/** Data de vencimento para N dias a partir de uma base (a mesma conta do banco). */
const venceEm=(base,dias)=>fimDoDia(new Date(Math.max(Date.now(),new Date(base||0).getTime())+dias*864e5))
/** Preço do período com o desconto do app (mesma conta do servidor do Pix). */
const precoPeriodo=(mensal,m,off)=>ppPreco(Number(mensal)||0,m,off).a
/** Quantos dias entre a base e uma data escolhida na mão. */
function diasAte(base,dataIso){const b=new Date(Math.max(Date.now(),new Date(base||0).getTime()))
 const a=new Date(dataIso+'T12:00:00'),x=new Date(b.getFullYear(),b.getMonth(),b.getDate(),12)
 return Math.max(1,Math.round((a-x)/864e5))}

function mtDraw(){const c=D.clients.find(x=>x.id===mt.id)
 dialogo(`<div class="dic">${ic('clock',24)}</div><h3>Mais tempo de teste</h3><p class="dm">${esc(c.name)}: ${new Date(c.expires_at)<Date.now()?'o teste acabou ('+vencTxt(c)+'). O tempo novo conta a partir de agora.':'teste até '+dtHm(c.expires_at)+' ('+vencTxt(c)+'). O tempo novo é somado.'}</p>
  <div class="opts">${HTESTE.map(([h,t])=>`<button class="opt${mt.h===h?' on':''}" onclick="mt.h=${h};mtDraw()"><b>+ ${t}</b><small>até ${dtHm(mtFim(c,h))}</small></button>`).join('')}</div>
  <div class="drow"><button class="btn" onclick="fechar()">Cancelar</button><button class="btn pri" onclick="mtOk()">${ic('clock',17)}Teste até ${dtHm(mtFim(c,mt.h))}</button></div>`)}
async function mtOk(){const c=D.clients.find(x=>x.id===mt.id),n=mtFim(c,mt.h);fechar()
 const r=await sb.from('clients').update({expires_at:n.toISOString(),active:true}).eq('id',mt.id);if(r.error)return erro(r.error);toast(c.name+': teste até '+dtHm(n));carregar()}
const velhosTeste=()=>D.clients.filter(c=>c.teste&&new Date(c.expires_at)<Date.now()-7*864e5)
async function apagarTestes(){const l=velhosTeste();if(!l.length)return
 if(!await confirmar({t:'Apagar '+pl(l.length,'teste','testes')+'?',m:'Testes que acabaram há mais de 7 dias e não pagaram: '+l.slice(0,6).map(c=>c.name).join(', ')+(l.length>6?' e mais '+(l.length-6):'')+'. Os códigos deles são apagados.',ok:'Apagar',perigo:true,icone:'trash'}))return
 const r=await sb.from('clients').delete().in('id',l.map(c=>c.id)).select('id');if(r.error)return erro(r.error);toast(pl(r.data?.length||0,'teste apagado','testes apagados'));carregar()}
async function setPeixe(id,on){const c=D.clients.find(x=>x.id===id);if(!c)return
 if(!await confirmar(on?{t:`Deixar “${c.name}” como Peixe?`,m:'Fica isento de pagamento: não vence, não recebe cobrança nem aviso de pagamento, e pode ter quantas telas quiser.',ok:'Ligar Peixe',icone:'check'}
  :{t:`Tirar o Peixe de “${c.name}”?`,m:`Volta a ser cliente normal: vence em ${dt(c.expires_at)}${days(c.expires_at)<0?' (já passou: as telas param até renovar)':''} e volta a ser cobrado.`,ok:'Tirar Peixe',perigo:days(c.expires_at)<0}))return
 const row={peixe:on};if(!on&&days(c.expires_at)<0)row.expires_at=novaData(c,1).toISOString() // dá 30 dias para não cortar na hora
 const r=await sb.from('clients').update(row).eq('id',id);if(r.error)return erro(r.error)
 toast(on?'🐟 '+c.name+' agora é Peixe':c.name+' voltou a ser cliente normal'+(row.expires_at?' (vence em '+dt(row.expires_at)+')':''));carregar()}
function avisoPara(id){const c=D.clients.find(x=>x.id===id);if(!c)return
 av.alvo='client';av.cli=id;av.kind='info';if(av.mod==='venc'||av.mod==='venceu')av.mod='';fecharSheet();ir('avisos')}
async function excluirCliente(id){const c=D.clients.find(x=>x.id===id)
 if(!await confirmar({t:`Excluir “${c.name}”?`,m:'Todos os códigos dele são apagados e os aparelhos param de funcionar. Se o app estiver aberto em algum aparelho, ele trava sozinho em até 1 minuto (não precisa fechar). Não dá para desfazer.',ok:'Excluir de vez',perigo:true,icone:'trash'}))return
 const r=await sb.from('clients').delete().eq('id',id).select('id');if(r.error)return erro(r.error)
 if(!r.data?.length)return toast('Não consegui excluir. Entre de novo no painel e tente outra vez.',true)
 fecharSheet();toast('Cliente “'+c.name+'” excluído');carregar()}

async function novoCodigo(cid){
 const label=await perguntar({t:'Nova tela',m:'Dê um nome para saber qual aparelho é. Pode deixar em branco.',label:'Nome do aparelho',ph:'Ex.: TV da sala',ok:'Gerar código'})
 if(label===null)return
 const r=await sb.rpc('admin_new_code',{p_client:cid,p_label:label.trim()});if(r.error)return erro(r.error)
 await carregar();toast('Código '+r.data+' criado');enviar(r.data)}
async function renomear(code){const k=D.codes.find(x=>x.code===code)
 const label=await perguntar({t:'Renomear tela',label:'Nome do aparelho',valor:k?.label||'',ph:'Ex.: TV do quarto'})
 if(label===null)return
 const r=await sb.from('codes').update({label:label.trim()||null}).eq('code',code);if(r.error)return erro(r.error);toast('Nome salvo');carregar()}

/* Renovar: escolhe o PERÍODO (os mesmos do app, com os descontos de Ajustes) e a data sai da conta.
 * Quem aplica é o banco (`admin_renovar` → `payment_apply`): soma ao que ainda resta e termina 23:59:59.
 * O valor recebido fica registrado no Financeiro — é isso que faz as estatísticas serem reais. */
let rn=null
function novaData(c,m){return venceEm(baseDe(c),m*DIAS_MES)}
function renovar(id){const c=D.clients.find(x=>x.id===id);if(!c)return
 if(c.peixe)return toast('Cliente Peixe não precisa renovar')
 rn={id,m:periodos()[0].m,data:'',valor:null};dlgRes=null;rnDraw()}
function rnDraw(){const c=D.clients.find(x=>x.id===rn.id),d=days(c.expires_at),per=periodos()
 const esc_=per.find(x=>x.m===rn.m)||per[0]
 if(rn.valor===null)rn.valor=precoPeriodo(precoDe(c),esc_.m,esc_.off).toFixed(2)
 const alvo=rn.data?new Date(rn.data+'T23:59:59'):venceEm(baseDe(c),esc_.m*DIAS_MES)
 dialogo(`<div class="dic">${ic('refresh',24)}</div><h3>${c.teste?'Virar cliente: ':'Renovar '}${esc(c.name)}</h3>
  <p class="dm">${d<0?`Venceu em <b>${dt(c.expires_at)}</b>: o período novo conta a partir de hoje.`:`Vence em <b>${dt(c.expires_at)}</b> (${vencTxt(c)}) — o período é somado ao que ele ainda tem.`}</p>
  <div class="opts" id="rnPer" style="grid-template-columns:repeat(2,minmax(0,1fr))">${per.map(x=>{const pr=precoPeriodo(precoDe(c),x.m,x.off)
   return `<button type="button" class="opt${!rn.data&&rn.m===x.m?' on':''}" data-m="${x.m}" onclick="rnSet(${x.m})"><b>${mesesTxt(x.m)}</b><small>${brl(pr)}${x.m>1?' · '+brl(pr/x.m)+'/mês':''}</small><small>até ${dt(venceEm(baseDe(c),x.m*DIAS_MES))}</small></button>`}).join('')}</div>
  <label class="f" style="margin-top:14px">Valor recebido (R$)<input class="field" id="rnV" type="number" min="0" step="0.01" value="${rn.valor}" oninput="rn.valor=this.value"><small style="display:block;margin-top:4px;font-size:11px;color:#8e87a8">Entra no Financeiro como pagamento. Deixe 0 se foi cortesia.</small></label>
  <label class="f" style="margin-top:12px">Ou escolha a data na mão<input class="field" type="date" value="${rn.data}" onchange="rn.data=this.value;rnDraw()"></label>
  <div class="vencp" id="rnPrev"></div>
  <div class="drow"><button class="btn" onclick="fechar()">Cancelar</button><button class="btn pri" onclick="rnOk()">Renovar até ${dt(alvo)}</button></div>`)
 rnPrev()}
function rnSet(m){rn.m=m;rn.data=''
 const c=D.clients.find(x=>x.id===rn.id),x=periodos().find(y=>y.m===m)||periodos()[0]
 rn.valor=precoPeriodo(precoDe(c),x.m,x.off).toFixed(2)
 const e=$('rnV');if(e)e.value=rn.valor
 document.querySelectorAll('#rnPer .opt').forEach(b=>b.classList.toggle('on',Number(b.dataset.m)===m));rnPrev()}
function rnPrev(){const el=$('rnPrev');if(!el)return
 const c=D.clients.find(x=>x.id===rn.id),x=periodos().find(y=>y.m===rn.m)||periodos()[0]
 const dias=rn.data?diasAte(baseDe(c),rn.data):x.m*DIAS_MES,n=venceEm(baseDe(c),dias)
 const valor=Number(String(rn.valor).replace(',','.'))||0
 el.innerHTML=`<div><small>Fica até</small><b>${dt(n)}</b></div><div><small>Somando</small><b>${pl(dias,'dia','dias')}</b></div>
  <div><small>No Financeiro</small><b style="color:${valor>0?'var(--ok)':'var(--mut)'}">${valor>0?brl(valor):'cortesia'}</b></div>`}
async function rnOk(){const c=D.clients.find(x=>x.id===rn.id)
 if(rn.data&&isNaN(new Date(rn.data+'T12:00:00')))return toast('Data inválida',true)
 const dias=rn.data?diasAte(baseDe(c),rn.data):(periodos().find(y=>y.m===rn.m)||{m:1}).m*DIAS_MES
 const valor=Math.max(0,Number(String(rn.valor).replace(',','.'))||0)
 fechar()
 const r=await sb.rpc('admin_renovar',{p_client:rn.id,p_dias:dias,p_valor:valor,p_nota:valor>0?'renovado no painel':'cortesia no painel'})
 if(r.error)return erro(r.error)
 if(r.data&&r.data.ok===false)return toast('O banco não aplicou a renovação. Tente de novo.',true)
 const n=r.data?.expires_at
 toast(c.name+': renovado até '+dt(n)+(valor>0?' · '+brl(valor)+' no Financeiro':' · cortesia'))
 carregar()}

/* Cobrar: mensagem pronta para o WhatsApp, com o link do Pix */
function cobrar(id){const c=D.clients.find(x=>x.id===id);if(!c)return;if(c.peixe)return toast('Cliente Peixe é isento de pagamento')
 const k=codigosDe(id)[0],d=days(c.expires_at)
 const quando=d<0?`venceu no dia ${dt(c.expires_at)}`:d===0?'vence hoje':`vence em ${pl(d,'dia','dias')} (${dt(c.expires_at)})`
 const txt=`Olá, ${c.name}! Tudo bem?\n\nSua assinatura do *MunizFlix* ${quando}.\n\n${k?`Para renovar é rapidinho, pelo Pix:\n${PAYURL(k.code)}\n\nAssim que o pagamento cair, o acesso renova sozinho. `:''}Qualquer dúvida, é só chamar!`
 dlgRes=null
 dialogo(`<h3>Cobrar ${esc(c.name)}</h3><p class="dm">Confira a mensagem. Pode mudar o texto antes de enviar.</p>
  <label class="f"><textarea class="field" id="eT" rows="9">${esc(txt)}</textarea></label>
  ${k?'':'<p class="h" style="margin-top:8px">Este cliente ainda não tem código, então a mensagem vai sem o link do Pix.</p>'}
  <div class="drow"><button class="btn" onclick="fechar()">Fechar</button>${k?`<button class="btn" onclick="copiarTxt('${PAYURL(k.code)}','Link do Pix copiado')">${ic('link',16)}Só o link</button>`:''}
  <button class="btn pri" onclick="window.open(wa('${c.phone||''}',$('eT').value),'_blank')">${ic('chat',17)}Abrir WhatsApp</button></div>`,'wide')}

async function ligar(id,on){const c=D.clients.find(x=>x.id===id)
 if(!on&&!await confirmar({t:`Desligar “${c.name}”?`,m:'Todos os aparelhos dele param de funcionar. Você pode ligar de novo quando quiser.',ok:'Desligar',perigo:true,icone:'power'}))return
 const r=await sb.from('clients').update({active:on}).eq('id',id);if(r.error)return erro(r.error);toast(on?'Cliente ligado':'Cliente desligado');carregar()}
async function salvarProtecao(on){
 const param=D.codes.filter(k=>k.active&&k.device_tag&&['antigo','falso'].includes(appTipo(k)))
 if(on&&param.length&&!await confirmar({t:`${pl(param.length,'aparelho vai','aparelhos vão')} PARAR de funcionar`,m:param.map(k=>'• '+(clienteDe(k)?.name||'?')+' ('+(k.label||k.code)+'): '+(appTipo(k)==='falso'?'app copiado':'precisa atualizar o app')).join('\n')+'\n\nLigar mesmo assim?',ok:'Ligar mesmo assim',perigo:true}))return
 if(on&&!param.length&&!await confirmar({t:'Ligar a proteção?',m:'Ninguém vai ficar sem assistir. Cópias do MunizFlix passam a ser recusadas.',ok:'Ligar proteção',icone:'shield'}))return
 if(!on&&!await confirmar({t:'Desligar a proteção?',m:'Cópias do MunizFlix voltam a conseguir usar a sua lista.',ok:'Desligar',perigo:true,icone:'shield'}))return
 const r=await sb.from('app_config').update({sig_enforce:on,updated_at:new Date().toISOString()}).eq('id',1)
 if(r.error)return erro(r.error)
 // ligar/desligar na mão limpa o registro da trava automática (só existe depois da migração
 // 20261119160000; se a coluna ainda não existir, o erro é ignorado de propósito)
 await sb.from('app_config').update({sig_auto_off_at:null}).eq('id',1).then(x=>x,()=>{})
 toast(on?'Proteção ligada':'Proteção desligada');carregar()}
async function ligarCodigo(code,on){
 if(!on&&!await confirmar({t:`Desligar a tela ${code}?`,m:'Esse aparelho para de funcionar. As outras telas do cliente continuam.',ok:'Desligar',perigo:true,icone:'power'}))return
 const r=await sb.from('codes').update({active:on}).eq('code',code);if(r.error)return erro(r.error);toast(on?'Tela ligada':'Tela desligada');carregar()}
async function tirarCelular(id){const r0=D.remotes.find(x=>x.id===id)
 if(!await confirmar({t:`Tirar o controle de “${r0?.name||'celular'}”?`,m:'Esse celular não consegue mais escolher o que passa nessa TV.',ok:'Tirar',perigo:true,icone:'phone'}))return
 const r=await sb.rpc('admin_remote_revoke',{p_id:id});if(r.error)return erro(r.error);toast('Celular removido');carregar()}
async function liberar(code){
 if(!await confirmar({t:`Trocar o aparelho do código ${code}?`,m:'O aparelho atual para de funcionar e o mesmo código poderá ser digitado em outra TV ou celular.',ok:'Soltar aparelho',icone:'swap'}))return
 const r=await sb.from('codes').update({device_id:null,device_tag:null,device_model:null,activated_at:null,last_seen:null,watching:null,watching_kind:null,watching_since:null,app_version:null}).eq('code',code)
 if(r.error)return erro(r.error);toast('Código livre para outro aparelho');carregar()}
async function excluirCodigo(code){
 if(!await confirmar({t:`Excluir o código ${code}?`,m:'O aparelho para de funcionar. Não dá para desfazer.',ok:'Excluir',perigo:true,icone:'trash'}))return
 const r=await sb.from('codes').delete().eq('code',code);if(r.error)return erro(r.error);if(sheet?.t==='tela'&&sheet.id===code)fecharSheet();toast('Código excluído');carregar()}

function enviar(code){const k=D.codes.find(x=>x.code===code),c=D.clients.find(x=>x.id===k?.client_id)
 const tt=c?.teste?`Seu *teste grátis* vai até ${dtHm(c.expires_at)}. Gostou? Assine pelo Pix no próprio app (em Assinatura), com este mesmo código: a liberação é na hora.\n\n`:''
 const txt=`Olá${c&&!c.teste?', '+c.name:''}! Seu acesso ao *MunizFlix* está pronto.\n\n${tt}Seu código: *${code}*\n(vale para 1 aparelho)\n\nComo instalar:\n• TV: abra o app Downloader e digite ${LINKS.dl}\n• Celular Android: ${LINKS.cel}\n• Computador: ${LINKS.pc}\n• iPhone ou iPad: abra ${SITE} no Safari\n\nDepois é só abrir o MunizFlix e digitar o código.\n\nQuer escolher filmes e canais pelo celular? Abra ${CTRL} e use o mesmo código.`
 dlgRes=null
 dialogo(`<h3>Enviar o código ${code}</h3><p class="dm">Mensagem pronta com o código e os links de instalação. Pode mudar o texto antes de enviar.</p>
  <label class="f"><textarea class="field" id="eT" rows="13">${esc(txt)}</textarea></label>
  <div class="drow"><button class="btn" onclick="fechar()">Fechar</button><button class="btn" onclick="copiarTxt($('eT').value,'Mensagem copiada')">${ic('copy',16)}Copiar</button>
  <button class="btn pri" onclick="window.open(wa('${c?.phone||''}',$('eT').value),'_blank')">${ic('chat',17)}Abrir WhatsApp</button></div>`,'wide')}

/* ---------- Início ---------- */
let timer
async function iniciar(){
 const{data:{session}}=await sb.auth.getSession()
 ;['vLogin','vNoAdmin','vApp'].forEach(v=>$(v).classList.add('hide'))
 if(!session){$('vLogin').classList.remove('hide');return}
 const{data:adm}=await sb.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle()
 if(!adm){$('naId').textContent=session.user.id;$('vNoAdmin').classList.remove('hide');return}
 $('btnBusca').innerHTML=ic('search',17)+'<span>Buscar cliente, código ou tela</span><kbd>Ctrl K</kbd>'
 $('btnUpd').innerHTML=ic('refresh',18);$('btnNovo').innerHTML=ic('plus',18)+'<span>Novo cliente</span>';$('btnTeste').innerHTML=ic('clock',18)+'<span>Teste</span>'
 $('vApp').classList.remove('hide');$('page').classList.add('enter');await carregar()
 // não atualiza no meio de uma digitação nem com janela aberta (ver ocupado())
 clearInterval(timer);timer=setInterval(pulso,10000)}
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&!$('vApp').classList.contains('hide')){e.preventDefault();buscar()}
 else if(e.key==='Escape'){if($('modal').innerHTML)fechar();else if(sheet)fecharSheet()}
 else if(e.key==='Enter'&&e.target.matches?.('.at,.kpi.click')){e.target.click()}})
// voltou para o painel (outra aba, ou do controle pelo botão "voltar"): atualiza na hora
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('vApp').classList.contains('hide'))pulso()})
window.addEventListener('pageshow',e=>{if(e.persisted&&!$('vApp').classList.contains('hide'))carregar({quieto:true})})
iniciar()
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})
</script>
