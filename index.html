<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<meta name="robots" content="noindex,nofollow">
<title>Painel MunizFlix</title>
<link rel="icon" href="mark.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel MF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#07060d;--bg2:#0d0b18;--card:#13101e;--card2:#1b1729;--line:rgba(139,92,246,.16);--line2:rgba(255,255,255,.06);--tx:#f3f0fa;--tx2:#c9c2df;--mut:#8b84a6;
 --grad:linear-gradient(135deg,#7c3aed,#c026d3);--ok:#4ade80;--warn:#fbbf24;--bad:#f43f5e;--acc:#a855f7;--side:236px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(90% 50% at 0% 0%,rgba(124,58,237,.12),transparent 60%),radial-gradient(70% 40% at 100% 100%,rgba(192,38,211,.08),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.hide{display:none!important}

/* ---------- estrutura: menu lateral (computador) / barra de baixo (celular) ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:rgba(10,8,19,.92);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:-.02em;padding:0 6px 18px}
.brand img{width:36px;height:36px;border-radius:10px}
.brand i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:10px;font-weight:800;color:var(--mut);letter-spacing:.16em}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;font-weight:700;color:var(--mut);text-align:left;font-size:14.5px}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{color:var(--tx);background:rgba(255,255,255,.04)}
.nav button.on{color:#fff;background:linear-gradient(90deg,rgba(124,58,237,.32),rgba(192,38,211,.12));box-shadow:inset 3px 0 0 #c026d3}
.nav button .cnt{margin-left:auto;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.07);color:var(--tx2);padding:2px 8px;border-radius:999px}
.nav button .cnt.live{background:rgba(74,222,128,.14);color:var(--ok)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line2)}
.side .foot small{color:var(--mut);font-size:11.5px;padding:0 6px}
.main{margin-left:var(--side);min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:22px 28px 60px}
.mtop{display:none}
.pagehd{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehd h1{font-size:25px;font-weight:900;letter-spacing:-.02em}
.pagehd p{color:var(--mut);font-size:13.5px;margin-top:3px}
.pagehd .sp{flex:1}
.upd{color:var(--mut);font-size:12px;font-weight:600}
h2{font-size:15.5px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2 .n{font-size:12.5px;color:var(--mut);font-weight:700}
h2 .lnk{margin-left:auto;font-size:12.5px;color:#c4b5fd;font-weight:700}

/* ---------- blocos ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 15px;border-radius:11px;font-weight:700;font-size:14px;background:var(--card2);border:1px solid var(--line);white-space:nowrap;text-decoration:none}
.btn:hover{border-color:rgba(168,85,247,.5)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff}
.btn.ok{background:rgba(74,222,128,.12);color:var(--ok);border-color:rgba(74,222,128,.3)}
.btn.bad{background:rgba(244,63,94,.1);color:#fb7185;border-color:rgba(244,63,94,.3)}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* números do topo */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;position:relative;overflow:hidden}
.kpi small{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:12.5px;font-weight:700}
.kpi b{display:block;font-size:28px;font-weight:900;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi em{display:block;font-style:normal;color:var(--mut);font-size:12px;font-weight:600;margin-top:2px}
.kpi.hl{background:linear-gradient(135deg,rgba(124,58,237,.28),rgba(192,38,211,.14));border-color:rgba(192,38,211,.38)}
.kpi .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(168,85,247,.16);font-size:14px}

/* gráfico de barras */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:rgba(255,255,255,.06);stroke-width:1}
.chart .ax{fill:var(--mut);font-size:11px;font-weight:600}
.chart .bar{fill:#a855f7}
.chart .bar.today{fill:#e879f9}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover+.bar,.chart g:hover .bar{fill:#c084fc}
.tip{position:absolute;pointer-events:none;background:#231d36;border:1px solid rgba(168,85,247,.45);border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:5}
.tip small{display:block;color:var(--mut);font-weight:600;font-size:11.5px}
.sum{display:flex;gap:22px;flex-wrap:wrap;margin:-2px 0 12px}
.sum div{display:flex;flex-direction:column}
.sum b{font-size:19px;font-weight:900}
.sum small{color:var(--mut);font-size:12px;font-weight:600}
em.agora{color:var(--ok);font-style:normal;font-weight:800}
.panel .note{margin:10px 0 0;color:var(--mut);font-size:12px}

/* listas */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line2);border-radius:13px;padding:11px 13px}
.row .k{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(168,85,247,.14);font-size:17px;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.row .t small{color:var(--mut);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-weight:800;font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rank{width:22px;color:var(--mut);font-weight:800;font-size:13px;text-align:center;flex:none}
.meter{height:4px;border-radius:4px;background:rgba(255,255,255,.06);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:#a855f7}
.empty{color:var(--mut);text-align:center;padding:30px 10px;border:1px dashed var(--line);border-radius:14px;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 4px rgba(244,63,94,.14);flex:none}
.dot.on,.dot.play{background:var(--ok);box-shadow:0 0 0 4px rgba(74,222,128,.16)}
.dot.play{animation:pulso 1.8s ease-in-out infinite}
@keyframes pulso{50%{box-shadow:0 0 0 7px rgba(74,222,128,.05)}}
.tag{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--tx2);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.08)}
.tag.warn{color:var(--warn);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}
.tag.bad{color:#fb7185;border-color:rgba(244,63,94,.35);background:rgba(244,63,94,.08)}
.tags{display:flex;gap:6px;flex-wrap:wrap}

/* filtros */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input{flex:1;min-width:200px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:rgba(168,85,247,.22);color:#fff}
.field,.bar input,select,textarea{height:42px;border-radius:11px;border:1px solid var(--line);background:var(--card);padding:0 12px;outline:none;width:100%}
textarea{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
.field:focus,.bar input:focus,select:focus,textarea:focus{border-color:var(--acc)}

/* telas (aparelhos) */
.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.dv{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.dv.off{opacity:.6}
.dvh{display:flex;align-items:center;gap:10px;min-width:0}
.dvh .nm{flex:1;min-width:0}
.dvh .nm b{display:block;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dvh .nm small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{font-weight:900;letter-spacing:.06em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.now{padding:9px 11px;border-radius:11px;background:linear-gradient(90deg,rgba(124,58,237,.24),rgba(192,38,211,.08));font-size:13.5px;font-weight:700;display:flex;gap:8px;align-items:center}
.now span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now small{color:var(--tx2);font-weight:600;font-size:12px;flex:none}
.idle{color:var(--mut);font-size:13px;padding:9px 11px;border-radius:11px;background:var(--bg2)}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st3 div{background:var(--bg2);border-radius:11px;padding:9px 10px}
.st3 b{display:block;font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
.st3 small{color:var(--mut);font-size:11.5px;font-weight:700}
.spark{display:flex;align-items:flex-end;gap:2px;height:34px}
.spark i{flex:1;background:#a855f7;border-radius:3px 3px 0 0;min-height:2px;opacity:.9}
.spark i.z{background:rgba(255,255,255,.07)}
.spark i.today{background:#e879f9}
.hist{display:flex;flex-direction:column;gap:5px}
.hist div{display:flex;gap:8px;font-size:12.5px;align-items:baseline}
.hist div span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx2);font-weight:600}
.hist div small{color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.meta{color:var(--mut);font-size:12px;line-height:1.55}
.meta b{color:var(--tx2);font-weight:700}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.more{position:relative}

/* clientes */
.cl{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.cl.off{opacity:.62}
.clh{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.clh .nm{flex:1;min-width:200px}
.clh .nm b{font-size:17px;font-weight:800}
.clh .nm small{display:block;color:var(--mut);font-size:13px;margin-top:3px}
.clh .tags{margin-top:8px}
.cds{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:14px}
.cd{border-radius:14px;padding:13px;background:var(--bg2);border:1px solid var(--line2);display:flex;flex-direction:column;gap:9px}
.cd .cc{display:flex;align-items:center;gap:10px}
.cd .cc .code{font-size:20px}
.cd .cc .lb{color:var(--tx2);font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd.add{display:grid;place-items:center;min-height:90px;color:var(--tx2);font-weight:800;border:1px dashed var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;color:var(--tx2);background:rgba(255,255,255,.05);padding:3px 8px;border-radius:7px}

/* ajustes */
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.box h3{font-size:15px;font-weight:800;margin-bottom:4px}
.box p.h{color:var(--mut);font-size:12.5px;margin-bottom:12px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--tx2)}
.plan{display:grid;grid-template-columns:1fr 90px 120px auto;gap:8px;align-items:end;margin-bottom:8px}

/* janelas */
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,2,8,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.md{width:100%;max-width:460px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid rgba(168,85,247,.35);border-radius:20px;padding:20px;box-shadow:0 30px 80px -20px rgba(124,58,237,.6)}
.md.wide{max-width:640px}
.md h3{font-size:18px;font-weight:900;margin-bottom:14px}
.md .f{margin-bottom:10px}
.md .mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lg{width:100%;max-width:380px;text-align:center}
.lg img{width:96px;height:96px;border-radius:24px;box-shadow:0 0 50px rgba(192,38,211,.45)}
.lg h1{font-size:28px;font-weight:900;margin:16px 0 4px}
.lg h1 i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg p{color:var(--mut);margin-bottom:20px}
.lg .field{margin-bottom:10px;height:48px}
.lg .btn{width:100%;height:48px;margin-top:4px}
.lg .lnk{margin-top:14px;color:var(--tx2);font-size:13.5px;text-decoration:underline}
.msg{margin-top:12px;font-size:13.5px;color:#fb7185;min-height:18px}
.msg.ok{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:#2a2340;border:1px solid rgba(168,85,247,.4);padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 14px 40px rgba(0,0,0,.5)}

/* clientes: filtros com contagem */
.cfil{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.cfil button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.cfil button b{font-size:22px;font-weight:900}
.cfil button span{font-size:12.5px;color:var(--mut);font-weight:700}
.cfil button.on{border-color:rgba(192,38,211,.55);background:linear-gradient(135deg,rgba(124,58,237,.25),rgba(192,38,211,.1))}
.cfil .f-breve b{color:var(--warn)}.cfil .f-venc b{color:#fb7185}.cfil .f-ok b{color:var(--ok)}.cfil .f-off b{color:var(--mut)}
/* clientes: tabela */
.ctab{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.chd,.cmain{display:grid;grid-template-columns:minmax(200px,2.2fr) 1.1fr 1.1fr 1.2fr .9fr .8fr auto;gap:12px;align-items:center;padding:0 16px}
.chd{height:40px;font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line2);background:rgba(255,255,255,.02)}
.crow{border-bottom:1px solid var(--line2)}
.crow:last-child{border-bottom:0}
.crow.off{opacity:.6}
.cmain{min-height:66px;cursor:pointer;padding-top:10px;padding-bottom:10px}
.cmain:hover{background:rgba(255,255,255,.025)}
.crow.op{background:rgba(124,58,237,.06)}
.cnm{display:flex;align-items:center;gap:11px;min-width:0}
.cnm>div{min-width:0}
.cnm b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnm small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:900;font-size:13.5px;background:hsl(var(--h) 45% 26%);color:#fff;border:1px solid hsl(var(--h) 50% 40% / .5)}
.cpl b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap}
.cpl small{display:block;color:var(--mut);font-size:12px;white-space:nowrap}
.ctv{display:flex;align-items:center;gap:5px}
.ctv small{color:var(--mut);font-size:12px;font-weight:700;margin-left:3px}
.cact{display:flex;align-items:center;gap:6px}
.chev{width:32px;height:32px;border-radius:9px;background:var(--card2);border:1px solid var(--line);color:var(--tx2)}
.cdet{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.cdet .cds{margin-top:0}
/* ajustes */
.aj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.aj .box{margin:0}
.aj .wide{grid-column:1/-1}
.bxh{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.bxh p.h{margin:2px 0 0}
.bxi{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:18px;background:rgba(168,85,247,.16)}
.bxf{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:14px}
.bxf .h{margin-right:auto;color:var(--mut);font-size:12px}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pc{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pc.add{align-items:center;justify-content:center;color:var(--tx2);font-weight:800;font-size:22px;border:1px dashed var(--line);min-height:150px;gap:4px}
.pc.add span{font-size:13px}
.pch{display:flex;align-items:center;gap:8px}
.pnm{flex:1;min-width:0;background:none;border:0;border-bottom:1px dashed transparent;font-weight:800;font-size:15.5px;outline:none;padding:2px 0}
.pnm:hover,.pnm:focus{border-bottom-color:var(--acc)}
.pcf{display:grid;grid-template-columns:70px 1fr;gap:8px}
.money{position:relative;display:block}
.money i{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mut);font-size:13px;font-weight:700}
.money input{padding-left:34px}
.lockpv{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:18px;border-radius:14px;margin-bottom:12px;background:radial-gradient(80% 90% at 50% 0%,rgba(124,58,237,.25),transparent),#0a0814;border:1px solid var(--line2)}
.lockpv img{width:46px;height:46px;border-radius:12px}
.lockpv b{font-size:15px}
.lockpv span{color:var(--tx2);font-size:13px;min-height:18px}
.srv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.srv h4{font-size:13px;font-weight:800;margin-bottom:8px;color:var(--tx2)}
.srv h4 small{font-weight:600;color:var(--mut)}
.pw{position:relative;display:block}
.pw input{padding-right:40px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:8px;opacity:.7}
.eye:hover{opacity:1;background:rgba(255,255,255,.06)}
.lnkbox{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line2);border-radius:11px;padding:6px 6px 6px 12px;margin-bottom:8px}

<script>
'use strict'

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})
const dt=d=>d?new Date(d).toLocaleDateString('pt-BR'):'—'
const dth=d=>d?new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'
const hm=d=>d?new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''
function ago(d){if(!d)return 'nunca';const s=(Date.now()-new Date(d))/1000
 if(s<60)return 'agora';if(s<3600)return 'há '+Math.floor(s/60)+' min';if(s<86400)return 'há '+Math.floor(s/3600)+' h';return 'há '+Math.floor(s/86400)+' dias'}
const days=d=>Math.ceil((new Date(d)-Date.now())/864e5)
/** minutos -> "45 min" / "2h 05" */
const tm=m=>{m=Math.round(m||0);if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return h+'h'+(r?' '+String(r).padStart(2,'0'):'')}
const hrs=m=>{const h=(m||0)/60;return h<10?h.toLocaleString('pt-BR',{maximumFractionDigits:1}):Math.round(h).toLocaleString('pt-BR')}
// TV desligada no botão não avisa que parou: sem sinal recente = offline, e o "assistindo" dela não vale mais
// início real do que está passando: a sessão aberta no histórico (sobrevive a pausa/atualização)
const desde=c=>{const r=(D.st?.codes?.[c.code]?.recent||[]).find(x=>x.on&&x.t===c.watching);return r?r.at:c.watching_since}
const online=c=>!!(c.last_seen&&(Date.now()-new Date(c.last_seen))<ONLINE_MIN*60000)
const KIND={live:'📺',movie:'🎬',series:'🎞️'}
const KNAME={live:'Canal',movie:'Filme',series:'Série'}
let toastT
function toast(t){clearTimeout(toastT);document.querySelectorAll('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);toastT=setTimeout(()=>e.remove(),2600)}
function erro(e){console.error(e);toast('Erro: '+(e?.message||e))}

/* ---------- Login ---------- */
let modoCriar=false
$('lgSwap').onclick=()=>{modoCriar=!modoCriar;$('lgGo').textContent=modoCriar?'Criar meu login':'Entrar';$('lgSwap').textContent=modoCriar?'Já tenho login: entrar':'Primeiro acesso? Criar meu login';$('lgSub').textContent=modoCriar?'Crie seu e-mail e senha do painel':'Painel do administrador';$('lgMsg').textContent=''}
$('lgPass').onkeydown=e=>{if(e.key==='Enter')$('lgGo').click()}
$('lgGo').onclick=async()=>{
 const email=$('lgEmail').value.trim(),password=$('lgPass').value,m=$('lgMsg');m.className='msg';m.textContent=''
 if(!email||password.length<8){m.textContent='Informe o e-mail e uma senha com pelo menos 8 caracteres.';return}
 $('lgGo').disabled=true
 try{
  if(modoCriar){const{data,error}=await sb.auth.signUp({email,password});if(error)throw error
   if(!data.session){m.className='msg ok';m.textContent='Login criado! Agora peça a liberação e depois entre com seu e-mail e senha.';modoCriar=true;$('lgSwap').click();return}}
  else{const{error}=await sb.auth.signInWithPassword({email,password});if(error)throw error}
  await iniciar()
 }catch(e){m.textContent=/Invalid login/i.test(e.message)?'E-mail ou senha incorretos.':/not confirmed/i.test(e.message)?'Login ainda não liberado.':e.message}
 finally{$('lgGo').disabled=false}}
async function sair(){await sb.auth.signOut();location.reload()}

/* ---------- Dados ---------- */
let D={plans:[],clients:[],codes:[],cfg:null,remotes:[],st:{codes:{},days:{},top:[]}},busca='',filtro='todas',buscaTv='',loadedAt=0
const PAGES=[['geral','Visão geral','M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z'],
 ['telas','Telas','M21 3H3a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h7v2H8v2h8v-2h-2v-2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 13H3V5h18v11z'],
 ['clientes','Clientes','M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 2 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z'],
 ['aovivo','Agora','M8 5v14l11-7z'],
 ['ajustes','Ajustes','M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.3 7.3 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.3 7.3 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5-2.2-1.6zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z']]
let tab=(()=>{const h=location.hash.slice(1);return PAGES.some(p=>p[0]===h)?h:'geral'})()

async function carregar(manual){
 try{
  // antes de ler: fecha o que ficou "assistindo" em TVs que sumiram
  await sb.rpc('admin_refresh').then(()=>{},()=>{})
  const [p,c,k,g,rm,st]=await Promise.all([
   sb.from('plans').select('*').order('screens'),
   sb.from('clients').select('*').order('name'),
   sb.from('codes').select('code,client_id,label,active,device_tag,device_model,app_version,activated_at,last_seen,watching,watching_kind,watching_since,created_at').order('created_at'),
   tab==='ajustes'||!D.cfg?sb.from('app_config').select('*').eq('id',1).single():Promise.resolve({data:D.cfg}),
   sb.from('remotes').select('id,code,name,last_seen,approved_at').eq('status','ok').order('approved_at'),
   sb.rpc('admin_watch_stats',{p_days:30})])
  for(const r of [p,c,k,g])if(r.error)throw r.error
  D={plans:p.data,clients:c.data,codes:k.data,cfg:g.data,remotes:rm.error?[]:rm.data,st:st.error||!st.data?{codes:{},days:{},top:[]}:st.data}
  loadedAt=Date.now();render();if(manual)toast('Atualizado')
 }catch(e){erro(e)}}
const plano=id=>D.plans.find(p=>p.id===id)
const codigosDe=id=>D.codes.filter(c=>c.client_id===id)
const clienteDe=k=>D.clients.find(x=>x.id===k.client_id)
const stOf=code=>D.st.codes?.[code]||{today:0,week:0,month:0,sessions:0,days:{},recent:[]}

/* ---------- Navegação ---------- */
function navHtml(){const on=D.codes.filter(online).length,watch=D.codes.filter(c=>online(c)&&c.watching).length
 const cnt={telas:`<span class="cnt${on?' live':''}">${on}/${D.codes.filter(c=>c.device_tag).length}</span>`,clientes:`<span class="cnt">${D.clients.length}</span>`,aovivo:watch?`<span class="cnt live">${watch}</span>`:''}
 $('nav').innerHTML=PAGES.map(([id,nm,ic])=>`<button data-t="${id}" class="${id===tab?'on':''}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="${ic}"/></svg><span>${nm}</span>${cnt[id]||''}</button>`).join('')
 $('updSide').textContent=loadedAt?'Atualizado '+hm(loadedAt)+' · sozinho a cada 20 s':''}
$('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;ir(b.dataset.t)}
function ir(t){tab=t;history.replaceState(null,'','#'+t);window.scrollTo(0,0);if(t==='ajustes')carregar();else render()}
function render(){navHtml();({geral:rGeral,telas:rTelas,clientes:rClientes,aovivo:rAoVivo,ajustes:rAjustes})[tab]()}
const head=(t,s,extra='')=>`<div class="pagehd"><div><h1>${t}</h1>${s?`<p>${s}</p>`:''}</div><div class="sp"></div>${extra}</div>`

function status(cl){const d=days(cl.expires_at)
 if(!cl.active)return['bad','Desligado']
 if(d<0)return['bad','Vencido']
 if(d<=3)return['warn',d===0?'Vence hoje':'Vence em '+d+(d===1?' dia':' dias')]
 return['ok','Ativo']}

/* ---------- Gráfico: horas assistidas por dia ---------- */
function ultimosDias(n){const l=[],d=new Date();d.setHours(12,0,0,0);for(let i=n-1;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);l.push(x)}return l}
const diaKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
const WD=['dom','seg','ter','qua','qui','sex','sáb']
// dias com registro (o histórico começou em D.st.since): não conta dias "vazios" de antes disso
function diasDesde(max){const s=D.st.since;if(!s)return max;const a=new Date(s+'T12:00:00'),b=new Date();b.setHours(12,0,0,0);return Math.max(1,Math.min(max,Math.round((b-a)/864e5)+1))}
function grafico(map){
 const ds=ultimosDias(Math.max(7,diasDesde(14))),vals=ds.map(d=>(map[diaKey(d)]||0)/60),mx=Math.max(1,...vals)
 const step=mx<=2?.5:mx<=5?1:mx<=12?2:mx<=30?5:10,top=Math.ceil(mx/step)*step
 const W=640,H=200,L=34,B=24,T=8,cw=(W-L)/ds.length,bw=Math.min(26,cw*.62),ys=v=>T+(H-T-B)*(1-v/top)
 let g=''
 for(let v=0;v<=top+1e-9;v+=step)g+=`<line class="gl" x1="${L}" x2="${W}" y1="${ys(v)}" y2="${ys(v)}"/><text class="ax" x="${L-8}" y="${ys(v)+4}" text-anchor="end">${v.toLocaleString('pt-BR')}h</text>`
 ds.forEach((d,i)=>{const v=vals[i],x=L+i*cw+(cw-bw)/2,y=ys(v),h=Math.max(0,H-B-y),last=i===ds.length-1
  const r=Math.min(4,h/2),path=h<=0?'':`M${x},${H-B} V${y+r} Q${x},${y} ${x+r},${y} H${x+bw-r} Q${x+bw},${y} ${x+bw},${y+r} V${H-B} Z`
  g+=`<g data-i="${i}"><rect class="hit" x="${L+i*cw}" y="${T}" width="${cw}" height="${H-T}"/>${path?`<path class="bar${last?' today':''}" d="${path}"/>`:''}</g>`
  if(ds.length<=7||i%2===ds.length%2||last)g+=`<text class="ax" x="${L+i*cw+cw/2}" y="${H-6}" text-anchor="middle">${last?'hoje':d.getDate()+'/'+(d.getMonth()+1)}</text>`})
 setTimeout(()=>{const el=document.querySelector('#chartH');if(!el)return;const tip=el.querySelector('.tip')
  el.querySelectorAll('g[data-i]').forEach(gr=>{gr.onmouseenter=gr.ontouchstart=()=>{const i=+gr.dataset.i,d=ds[i],r=gr.querySelector('rect').getBoundingClientRect(),b=el.getBoundingClientRect()
    tip.innerHTML=`${tm(vals[i]*60)}<small>${WD[d.getDay()]}, ${d.toLocaleDateString('pt-BR')}</small>`;tip.style.left=(r.left-b.left+r.width/2)+'px';tip.style.top=(Math.max(ys(vals[i]),T)/H*el.querySelector('svg').getBoundingClientRect().height-6)+'px';tip.classList.remove('hide')}
   gr.onmouseleave=()=>tip.classList.add('hide')})},0)
 return `<div class="chart" id="chartH"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Horas assistidas por dia nos últimos 14 dias">${g}</svg><div class="tip hide"></div></div>`}

/* ---------- Visão geral ---------- */
function rGeral(){
 const ativos=D.clients.filter(c=>c.active&&days(c.expires_at)>=0),on=D.codes.filter(online),vendo=on.filter(c=>c.watching)
 const vencendo=D.clients.filter(c=>c.active&&days(c.expires_at)>=0&&days(c.expires_at)<=7),vencidos=D.clients.filter(c=>c.active&&days(c.expires_at)<0)
 const receita=ativos.reduce((s,c)=>s+Number(c.price||0),0)
 const sc=Object.values(D.st.codes||{}),hoje=sc.reduce((s,x)=>s+(x.today||0),0),sem=sc.reduce((s,x)=>s+(x.week||0),0),mes=sc.reduce((s,x)=>s+(x.month||0),0)
 const top=(D.st.top||[]).slice(0,7),mxTop=Math.max(1,...top.map(t=>t.m))
 const rank=Object.entries(D.st.codes||{}).map(([code,x])=>({k:D.codes.find(c=>c.code===code),x})).filter(r=>r.k&&r.x.week>0).sort((a,b)=>b.x.week-a.x.week).slice(0,6)
 $('page').innerHTML=head('Visão geral',`${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}`)+`
 <div class="kpis">
  <div class="kpi hl"><small><span class="ic">🟢</span>Online agora</small><b>${on.length}</b><em>${vendo.length} assistindo</em></div>
  <div class="kpi"><small><span class="ic">⏱️</span>Assistido hoje</small><b>${tm(hoje)}</b><em>${hrs(sem)} h nos últimos 7 dias</em></div>
  <div class="kpi"><small><span class="ic">👥</span>Clientes ativos</small><b>${ativos.length}</b><em>${D.codes.filter(c=>c.device_tag).length} de ${D.codes.length} códigos em uso</em></div>
  <div class="kpi"><small><span class="ic">💰</span>Receita por mês</small><b>${brl(receita)}</b><em>só clientes ativos</em></div>
  <div class="kpi"><small><span class="ic">📅</span>Vencimentos</small><b style="color:${vencendo.length+vencidos.length?'var(--warn)':''}">${vencendo.length}</b><em>${vencidos.length?`<span style="color:#fb7185">${vencidos.length} vencido${vencidos.length>1?'s':''}</span> · `:''}nos próximos 7 dias</em></div></div>
 <div class="cols c16">
  <div class="panel"><h2>Tempo assistido por dia <span class="n">todas as telas</span></h2>
   <div class="sum"><div><b>${tm(hoje)}</b><small>hoje</small></div><div><b>${tm(sem)}</b><small>7 dias</small></div><div><b>${tm(mes)}</b><small>30 dias</small></div><div><b>${sem?tm(sem/diasDesde(7)):'—'}</b><small>média por dia</small></div></div>
   ${grafico(D.st.days||{})}
   ${D.st.since&&diasDesde(30)<30?`<p class="note">O histórico começou em ${new Date(D.st.since+'T12:00:00').toLocaleDateString('pt-BR')}. Sessões com menos de 1 minuto (zapping) não contam.</p>`:''}</div>
  <div class="panel"><h2>Mais assistidos <span class="n">30 dias</span></h2>
   ${top.length?'<div class="list">'+top.map((t,i)=>`<div class="row" style="padding:9px 11px"><span class="rank">${i+1}</span><div class="t"><b>${esc(t.t)}</b><small>${KNAME[t.k]||''}${t.n>1?' · em '+t.n+' telas':''}</small><div class="meter"><i style="width:${Math.round(t.m/mxTop*100)}%"></i></div></div><span class="v">${tm(t.m)}</span></div>`).join('')+'</div>'
   :'<div class="empty">O histórico começa a contar a partir de agora. Assim que as TVs assistirem algo, aparece aqui.</div>'}</div></div>
 <div class="cols">
  <div class="panel"><h2>Assistindo agora <button class="lnk" onclick="ir('aovivo')">ver tudo ›</button></h2>${listaAoVivo(5)}</div>
  <div class="panel"><h2>Quem mais assistiu <span class="n">7 dias</span><button class="lnk" onclick="ir('telas')">telas ›</button></h2>
   ${rank.length?'<div class="list">'+rank.map(({k,x})=>`<div class="row" style="cursor:pointer" onclick="historico('${k.code}')"><span class="dot${online(k)?(k.watching?' play':' on'):''}"></span><div class="t"><b>${esc(k.label||k.code)}</b><small>${esc(clienteDe(k)?.name||'')} · hoje ${tm(x.today)}</small></div><span class="v">${tm(x.week)}</span></div>`).join('')+'</div>'
   :'<div class="empty">Sem tempo assistido nos últimos 7 dias ainda.</div>'}</div></div>
 <div class="panel" style="margin-top:16px"><h2>Vencem em breve <button class="lnk" onclick="ir('clientes')">clientes ›</button></h2>
  ${vencendo.concat(vencidos).sort((a,b)=>new Date(a.expires_at)-new Date(b.expires_at)).map(c=>{const[s,t]=status(c)
   return `<div class="row" style="margin-bottom:8px"><div class="k">📅</div><div class="t"><b>${esc(c.name)}</b><small>${dt(c.expires_at)} · ${brl(c.price)}</small></div><span class="tag ${s}">${t}</span><button class="btn sm ok" onclick="renovar('${c.id}')">+30 dias</button></div>`}).join('')||'<div class="empty">Ninguém vencendo nos próximos 7 dias 🎉</div>'}</div>`}

function listaAoVivo(max){
 const on=D.codes.filter(online).sort((a,b)=>(b.watching?1:0)-(a.watching?1:0))
 if(!on.length)return '<div class="empty">Nenhuma tela online agora.</div>'
 return '<div class="list">'+on.slice(0,max||999).map(c=>{const cl=clienteDe(c)
  return `<div class="row"><div class="k">${c.watching?KIND[c.watching_kind]||'▶️':'💤'}</div><div class="t"><b>${c.watching?esc(c.watching):'No menu do app'}</b>
  <small>${esc(c.label||c.code)} · ${esc(cl?.name||'?')}${desde(c)?' · há '+tm((Date.now()-new Date(desde(c)))/60000):''}</small></div>
  ${c.device_tag&&c.active?`<a class="btn sm" href="controle/?tv=${c.code}">📱</a>`:''}<span class="dot ${c.watching?'play':'on'}"></span></div>`}).join('')+'</div>'}

function rAoVivo(){$('page').innerHTML=head('Assistindo agora','Telas online e o que está passando. Atualiza sozinho a cada 20 segundos.')+`<div class="panel">${listaAoVivo()}</div>`}

/* ---------- Telas: cada aparelho com tempo de tela e histórico ---------- */
function spark(map){const ds=ultimosDias(14),v=ds.map(d=>map?.[diaKey(d)]||0),mx=Math.max(1,...v)
 return `<div class="spark" title="Últimos 14 dias">${v.map((x,i)=>`<i class="${x?'':'z'}${i===13&&x?' today':''}" style="height:${x?Math.max(8,Math.round(x/mx*100)):6}%" title="${ds[i].toLocaleDateString('pt-BR')}: ${tm(x)}"></i>`).join('')}</div>`}
function cardTela(k){
 const on=online(k),s=stOf(k.code),cl=clienteDe(k),rem=D.remotes.filter(r=>r.code===k.code)
 return `<div class="dv${k.active?'':' off'}">
  <div class="dvh"><span class="dot${on?(k.watching?' play':' on'):''}"></span><div class="nm"><b>${esc(k.label||'Tela sem nome')}</b><small>${esc(cl?.name||'?')} · <span class="code">${k.code}</span></small></div>
   ${k.active?'':'<span class="tag bad">Desligado</span>'}</div>
  ${on&&k.watching?`<div class="now">${KIND[k.watching_kind]||'▶️'}<span>${esc(k.watching)}</span><small>há ${tm((Date.now()-new Date(desde(k)))/60000)}</small></div>`
   :`<div class="idle">${on?'💤 Online, no menu do app':'Offline · visto '+ago(k.last_seen)}</div>`}
  <div class="st3"><div><b>${tm(s.today)}</b><small>Hoje</small></div><div><b>${tm(s.week)}</b><small>7 dias</small></div><div><b>${tm(s.month)}</b><small>30 dias</small></div></div>
  ${spark(s.days)}
  ${s.recent?.length?`<div class="hist">${s.recent.slice(0,3).map(r=>`<div>${KIND[r.k]||'▶️'}<span>${esc(r.t)}</span><small>${dth(r.at)} · ${tm(r.m)}${r.on?' · <em class="agora">agora</em>':''}</small></div>`).join('')}</div>`:''}
  <div class="meta">📺 ${k.device_tag?`<b>${esc(k.device_model||k.device_tag)}</b>${k.app_version?' · v'+esc(k.app_version):''}`:'Aguardando ativação'}${rem.length?'<br>📱 Controle: '+rem.map(r=>'<b>'+esc(r.name)+'</b>').join(', '):''}</div>
  <div class="acts">
   ${k.device_tag&&k.active?`<a class="btn sm pri" href="controle/?tv=${k.code}">📱 Controlar</a>`:''}
   <button class="btn sm" onclick="historico('${k.code}')">📊 Histórico</button>
   <button class="btn sm" onclick="enviar('${k.code}')">📤 Enviar</button></div></div>`}
function rTelas(){
 const q=buscaTv.toLowerCase()
 let l=D.codes.filter(k=>k.device_tag||filtro==='todas')
 if(filtro==='online')l=l.filter(online);else if(filtro==='vendo')l=l.filter(k=>online(k)&&k.watching)
 if(q)l=l.filter(k=>(k.label||'').toLowerCase().includes(q)||k.code.toLowerCase().includes(q)||(clienteDe(k)?.name||'').toLowerCase().includes(q))
 l.sort((a,b)=>(online(b)?2:0)+(b.watching?1:0)-(online(a)?2:0)-(a.watching?1:0)||(stOf(b.code).week-stOf(a.code).week))
 const seg=[['todas','Todas'],['online','Online'],['vendo','Assistindo']]
 $('page').innerHTML=head('Telas','Cada aparelho: o que está passando, tempo de tela e o que assistiu.')+`
 <div class="bar"><input id="buscaTv" placeholder="Buscar tela, código ou cliente" value="${esc(buscaTv)}">
  <div class="seg">${seg.map(([v,t])=>`<button class="${filtro===v?'on':''}" onclick="filtro='${v}';rTelas()">${t}</button>`).join('')}</div></div>
 ${l.length?`<div class="devs">${l.map(cardTela).join('')}</div>`:'<div class="empty">Nenhuma tela neste filtro.</div>'}`
 const b=$('buscaTv');b.oninput=()=>{buscaTv=b.value;const p=b.selectionStart;rTelas();const n=$('buscaTv');n.focus();n.setSelectionRange(p,p)}}

function historico(code){const k=D.codes.find(x=>x.code===code),s=stOf(code),cl=k&&clienteDe(k)
 modal(`<h3>📊 ${esc(k?.label||code)} <span style="color:var(--mut);font-size:13px;font-weight:700">${esc(cl?.name||'')} · ${code}</span></h3>
  <div class="st3" style="margin-bottom:12px"><div><b>${tm(s.today)}</b><small>Hoje</small></div><div><b>${tm(s.week)}</b><small>7 dias</small></div><div><b>${tm(s.month)}</b><small>30 dias</small></div></div>
  ${spark(s.days)}
  <h2 style="margin-top:16px">Últimas coisas assistidas</h2>
  ${s.recent?.length?'<div class="list">'+s.recent.map(r=>`<div class="row" style="padding:9px 11px"><div class="k">${KIND[r.k]||'▶️'}</div><div class="t"><b>${esc(r.t)}</b><small>${dth(r.at)}${r.on?' · <em class="agora">assistindo agora</em>':''}</small></div><span class="v">${tm(r.m)}</span></div>`).join('')+'</div>':'<div class="empty">Ainda sem histórico nesta tela.</div>'}
  <div class="mrow">${k?.device_tag&&k.active?`<a class="btn pri" href="controle/?tv=${code}">📱 Controlar</a>`:''}<button class="btn" onclick="fechar()">Fechar</button></div>`,true)}

/* ---------- Clientes ---------- */
let cFiltro='todos',cOrdem='venc',aberto=''
const sit=c=>{const d=days(c.expires_at);return !c.active?'off':d<0?'venc':d<=7?'breve':'ok'}
const ini=s=>s.replace(/\(.*?\)/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()
const hueOf=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return h}
function rClientes(){
 const q=busca.toLowerCase()
 const cont={todos:D.clients.length,ok:0,breve:0,venc:0,off:0};D.clients.forEach(c=>cont[sit(c)]++)
 let lst=D.clients.filter(c=>(cFiltro==='todos'||sit(c)===cFiltro)&&(!q||c.name.toLowerCase().includes(q)||(c.phone||'').includes(q)||codigosDe(c.id).some(k=>k.code.toLowerCase().includes(q)||(k.label||'').toLowerCase().includes(q))))
 const sem=c=>codigosDe(c.id).reduce((a,k)=>a+stOf(k.code).week,0)
 lst=lst.sort(cOrdem==='nome'?(a,b)=>a.name.localeCompare(b.name):cOrdem==='uso'?(a,b)=>sem(b)-sem(a):(a,b)=>new Date(a.expires_at)-new Date(b.expires_at))
 const F=[['todos','Todos'],['ok','Em dia'],['breve','Vencem em 7 dias'],['venc','Vencidos'],['off','Desligados']]
 const receita=D.clients.filter(c=>sit(c)==='ok'||sit(c)==='breve').reduce((s,c)=>s+Number(c.price||0),0)
 $('page').innerHTML=head('Clientes',`${D.clients.length} clientes · ${D.codes.filter(k=>k.device_tag).length} telas ativadas · ${brl(receita)} por mês`,'<button class="btn pri" onclick="formCliente()">+ Novo cliente</button>')+`
 <div class="cfil">${F.map(([v,t])=>`<button class="${cFiltro===v?'on':''} f-${v}" onclick="cFiltro='${v}';rClientes()"><b>${cont[v]}</b><span>${t}</span></button>`).join('')}</div>
 <div class="bar"><input id="busca" placeholder="Buscar por nome, telefone, código ou tela" value="${esc(busca)}">
  <div class="seg">${[['venc','Vencimento'],['nome','Nome'],['uso','Mais assistem']].map(([v,t])=>`<button class="${cOrdem===v?'on':''}" onclick="cOrdem='${v}';rClientes()">${t}</button>`).join('')}</div></div>
 ${lst.length?`<div class="ctab"><div class="chd"><span>Cliente</span><span>Situação</span><span>Plano</span><span>Vencimento</span><span>Telas</span><span>7 dias</span><span></span></div>${lst.map(linhaCliente).join('')}</div>`
  :'<div class="empty">Nenhum cliente neste filtro.</div>'}`
 const b=$('busca');b.oninput=()=>{busca=b.value;const p=b.selectionStart;rClientes();const n=$('busca');n.focus();n.setSelectionRange(p,p)}}

function linhaCliente(c){
 const p=plano(c.plan_id),ks=codigosDe(c.id),lim=p?p.screens:1,[s,t]=status(c),d=days(c.expires_at),sem=ks.reduce((a,k)=>a+stOf(k.code).week,0),op=aberto===c.id
 const tel=c.phone?(c.phone.length<=11?'55':'')+c.phone:''
 return `<div class="crow${op?' op':''}${c.active?'':' off'}">
  <div class="cmain" onclick="aberto=aberto==='${c.id}'?'':'${c.id}';rClientes()">
   <div class="cnm"><span class="av" style="--h:${hueOf(c.name)}">${esc(ini(c.name))}</span><div><b>${esc(c.name)}</b><small>${c.phone?esc(c.phone):'sem telefone'}${c.notes?' · '+esc(c.notes):''}</small></div></div>
   <div><span class="tag ${s}">${t}</span></div>
   <div class="cpl"><b>${esc(p?.name||'Sem plano')}</b><small>${brl(c.price)}/mês</small></div>
   <div class="cpl"><b>${dt(c.expires_at)}</b><small style="color:${d<0?'#fb7185':d<=7?'var(--warn)':''}">${d<0?'venceu há '+(-d)+' dia'+(d===-1?'':'s'):d===0?'vence hoje':'em '+d+' dia'+(d===1?'':'s')}</small></div>
   <div class="ctv">${ks.map(k=>`<span class="dot${online(k)?(k.watching?' play':' on'):''}" title="${esc(k.label||k.code)}"></span>`).join('')}<small>${ks.filter(k=>k.device_tag).length}/${lim}</small></div>
   <div class="cpl"><b>${sem?tm(sem):'—'}</b></div>
   <div class="cact" onclick="event.stopPropagation()"><button class="btn sm ok" onclick="renovar('${c.id}')">+30 dias</button><button class="chev" onclick="aberto=aberto==='${c.id}'?'':'${c.id}';rClientes()">${op?'▴':'▾'}</button></div>
  </div>
  ${op?`<div class="cdet">
   <div class="acts">
    <button class="btn sm" onclick="formCliente('${c.id}')">✏️ Editar</button>
    ${tel?`<a class="btn sm" target="_blank" href="https://wa.me/${tel}">💬 WhatsApp</a>`:''}
    ${ks.length<lim?`<button class="btn sm" onclick="novoCodigo('${c.id}')">＋ Gerar código (${ks.length}/${lim})</button>`:''}
    <button class="btn sm ${c.active?'bad':'ok'}" style="margin-left:auto" onclick="ligar('${c.id}',${!c.active})">${c.active?'Desligar cliente':'Ligar cliente'}</button></div>
   <div class="cds">${ks.map(cardCodigo).join('')||'<div class="empty">Nenhum código ainda.</div>'}</div></div>`:''}</div>`}

function cardCodigo(k){
 const on=online(k),s=stOf(k.code)
 return `<div class="cd"><div class="cc"><span class="dot${on?(k.watching?' play':' on'):''}"></span><span class="code">${k.code}</span><span class="lb">${esc(k.label||'')}</span>
  ${k.active?'':'<span class="tag bad">Desligado</span>'}</div>
  <div class="meta">${k.device_tag?`📺 <b>${esc(k.device_tag)}</b> · ${esc(k.device_model||'')}<br>Ativado ${dth(k.activated_at)} · visto ${ago(k.last_seen)}${k.app_version?' · v'+esc(k.app_version):''}`:'⏳ Aguardando ativação no aparelho'}</div>
  ${on&&k.watching?`<div class="now">${KIND[k.watching_kind]||'▶️'}<span>${esc(k.watching)}</span><small>desde ${hm(desde(k))}</small></div>`:''}
  ${k.device_tag?`<div class="chips"><span class="chip">Hoje ${tm(s.today)}</span><span class="chip">7 dias ${tm(s.week)}</span><span class="chip">30 dias ${tm(s.month)}</span></div>`:''}
  ${D.remotes.filter(r=>r.code===k.code).map(r=>`<div class="meta">📱 Controle: <b>${esc(r.name)}</b> · usado ${ago(r.last_seen||r.approved_at)} <button class="btn sm bad" style="height:24px;padding:0 8px;margin-left:4px" onclick="tirarCelular('${r.id}')">Tirar</button></div>`).join('')}
  <div class="acts">
   ${k.device_tag&&k.active?`<a class="btn sm pri" href="controle/?tv=${k.code}">📱 Controlar</a>`:''}
   ${k.device_tag?`<button class="btn sm" onclick="historico('${k.code}')">📊</button>`:''}
   <button class="btn sm" onclick="enviar('${k.code}')">📤 Enviar</button>
   <button class="btn sm" onclick="copiar('${k.code}')">Copiar</button>
   ${k.device_tag?`<button class="btn sm" onclick="liberar('${k.code}')">Trocar aparelho</button>`:''}
   <button class="btn sm ${k.active?'bad':'ok'}" onclick="ligarCodigo('${k.code}',${!k.active})">${k.active?'Desligar':'Ligar'}</button>
   <button class="btn sm bad" onclick="excluirCodigo('${k.code}')">Excluir</button></div></div>`}

/* ---------- Ações ---------- */
function modal(html,wide){$('modal').innerHTML=`<div class="ov" onclick="if(event.target===this)fechar()"><div class="md${wide?' wide':''}">${html}</div></div>`}
function fechar(){$('modal').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modal').innerHTML)fechar()})
const isoDia=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}

function formCliente(id){
 const c=id?D.clients.find(x=>x.id===id):{name:'',phone:'',notes:'',plan_id:D.plans[0]?.id,price:D.plans[0]?.price||0,expires_at:new Date(Date.now()+30*864e5)}
 modal(`<h3>${id?'Editar cliente':'Novo cliente'}</h3>
  <label class="f">Nome (pessoa ou casa)<input class="field" id="fN" value="${esc(c.name)}" placeholder="Ex.: Casa dos pais"></label>
  <label class="f">WhatsApp<input class="field" id="fT" value="${esc(c.phone||'')}" placeholder="Ex.: 91999990000" inputmode="tel"></label>
  <div class="grid2"><label class="f">Plano<select id="fP">${D.plans.map(p=>`<option value="${p.id}"${p.id===c.plan_id?' selected':''}>${esc(p.name)} (${p.screens} tela${p.screens>1?'s':''})</option>`).join('')}</select></label>
   <label class="f">Mensalidade (R$)<input class="field" id="fV" type="number" min="0" step="0.01" value="${c.price}"></label></div>
  <label class="f">Vencimento<input class="field" id="fE" type="date" value="${isoDia(c.expires_at)}"></label>
  <label class="f">Observação<input class="field" id="fO" value="${esc(c.notes||'')}"></label>
  <div class="mrow">${id?`<button class="btn bad" style="margin-right:auto" onclick="excluirCliente('${id}')">Excluir</button>`:''}<button class="btn" onclick="fechar()">Cancelar</button><button class="btn pri" id="fS">Salvar</button></div>`)
 $('fP').onchange=()=>{const p=plano(Number($('fP').value));if(p)$('fV').value=p.price}
 $('fS').onclick=async()=>{
  const name=$('fN').value.trim();if(!name){toast('Informe o nome');return}
  const v=$('fE').value;if(!v){toast('Informe o vencimento');return}
  const row={name,phone:$('fT').value.replace(/\D/g,'')||null,notes:$('fO').value.trim()||null,plan_id:Number($('fP').value)||null,price:Number($('fV').value)||0,expires_at:new Date(v+'T23:59:59').toISOString()}
  $('fS').disabled=true
  const r=id?await sb.from('clients').update(row).eq('id',id):await sb.from('clients').insert(row).select().single()
  if(r.error){$('fS').disabled=false;return erro(r.error)}
  fechar();await carregar()
  if(!id){toast('Cliente criado. Gerando o primeiro código…');novoCodigo(r.data.id)}else toast('Salvo')}}

async function excluirCliente(id){const c=D.clients.find(x=>x.id===id)
 if(!confirm(`Excluir "${c.name}" e todos os códigos dele? Os aparelhos param de funcionar. Não dá para desfazer.`))return
 const r=await sb.from('clients').delete().eq('id',id);if(r.error)return erro(r.error);fechar();toast('Cliente excluído');carregar()}

async function novoCodigo(cid){
 const label=prompt('Nome do aparelho (opcional). Ex.: TV da sala','')
 if(label===null)return
 const r=await sb.rpc('admin_new_code',{p_client:cid,p_label:label});if(r.error)return erro(r.error)
 await carregar();toast('Código '+r.data+' criado');enviar(r.data)}

async function renovar(id){const c=D.clients.find(x=>x.id===id)
 const base=Math.max(Date.now(),new Date(c.expires_at).getTime()),n=new Date(base+30*864e5);n.setHours(23,59,59,0)
 if(!confirm(`Renovar "${c.name}" até ${n.toLocaleDateString('pt-BR')}?`))return
 const r=await sb.from('clients').update({expires_at:n.toISOString(),active:true}).eq('id',id);if(r.error)return erro(r.error);toast('Renovado até '+n.toLocaleDateString('pt-BR'));carregar()}

async function ligar(id,on){const c=D.clients.find(x=>x.id===id)
 if(!on&&!confirm(`Desligar "${c.name}"? Todos os aparelhos dele param de funcionar.`))return
 const r=await sb.from('clients').update({active:on}).eq('id',id);if(r.error)return erro(r.error);toast(on?'Ligado':'Desligado');carregar()}

async function ligarCodigo(code,on){
 if(!on&&!confirm(`Desligar o código ${code}? Esse aparelho para de funcionar.`))return
 const r=await sb.from('codes').update({active:on}).eq('code',code);if(r.error)return erro(r.error);toast(on?'Código ligado':'Código desligado');carregar()}

async function tirarCelular(id){const r0=D.remotes.find(x=>x.id===id)
 if(!confirm(`Tirar o controle de "${r0?.name||'celular'}"? Esse celular não consegue mais escolher o que passa nessa TV.`))return
 const r=await sb.rpc('admin_remote_revoke',{p_id:id});if(r.error)return erro(r.error);toast('Celular removido');carregar()}

async function liberar(code){
 if(!confirm(`Soltar o aparelho do código ${code}? O aparelho atual para de funcionar e o código poderá ser usado em outra TV.`))return
 const r=await sb.from('codes').update({device_id:null,device_tag:null,device_model:null,activated_at:null,last_seen:null,watching:null,watching_kind:null,watching_since:null,app_version:null}).eq('code',code)
 if(r.error)return erro(r.error);toast('Código livre para outro aparelho');carregar()}

async function excluirCodigo(code){
 if(!confirm(`Excluir o código ${code}? O aparelho para de funcionar. Não dá para desfazer.`))return
 const r=await sb.from('codes').delete().eq('code',code);if(r.error)return erro(r.error);toast('Código excluído');carregar()}

function copiar(code){navigator.clipboard?.writeText(code).then(()=>toast('Código '+code+' copiado'),()=>toast(code))}

function enviar(code){const k=D.codes.find(x=>x.code===code),c=D.clients.find(x=>x.id===k?.client_id)
 const txt=`Olá${c?' '+c.name:''}! Seu acesso ao *MunizFlix* está pronto 🎬\n\n1) Baixe o app: ${APK}\n2) Instale e abra\n3) Digite o código: *${code}*\n\nO código funciona em 1 aparelho.

📱 Quer escolher filmes e canais pelo celular? Abra ${CTRL} e use o mesmo código.`
 modal(`<h3>Enviar código ${code}</h3><textarea class="field" id="eT" style="min-height:170px">${esc(txt)}</textarea>
  <div class="mrow"><button class="btn" onclick="fechar()">Fechar</button><button class="btn" onclick="navigator.clipboard.writeText($('eT').value).then(()=>toast('Mensagem copiada'))">Copiar</button>
  <button class="btn pri" onclick="window.open('https://wa.me/${c?.phone?(c.phone.length<=11?'55':'')+c.phone:''}?text='+encodeURIComponent($('eT').value),'_blank')">WhatsApp</button></div>`)}

async function salvarPlano(id){
 const row={name:$('pn'+id).value.trim(),screens:Number($('ps'+id).value),price:Number($('pp'+id).value)||0}
 if(!row.name||!(row.screens>=1&&row.screens<=10)){toast('Confira nome e telas (1 a 10)');return}
 const r=await sb.from('plans').update(row).eq('id',id);if(r.error)return erro(r.error);toast('Plano salvo');carregar()}
async function novoPlano(){const r=await sb.from('plans').insert({name:'Novo plano',screens:1,price:0});if(r.error)return erro(r.error);carregar()}
async function salvarContato(){const r=await sb.from('app_config').update({contact:$('cfContato').value.trim(),updated_at:new Date().toISOString()}).eq('id',1);if(r.error)return erro(r.error);toast('Contato salvo');carregar()}
async function salvarServidor(){
 const servers=$('cfSrv').value.split('\n').map(s=>s.trim().replace(/\/+$/,'')).filter(Boolean)
 if(!servers.length||!servers.every(s=>/^https?:\/\/\S+$/.test(s))){toast('Endereço inválido (use http://...)');return}
 const user=$('cfUser').value.trim(),pass=$('cfPass').value
 if(!user||!pass){toast('Informe usuário e senha');return}
 const xu=$('cfXu').value.trim().replace(/\/+$/,''),extra=xu?[{url:xu,user:$('cfXl').value.trim(),pass:$('cfXp').value}]:[]
 if(!confirm('Salvar o servidor? Todos os aparelhos passam a usar estes dados na próxima vez que abrirem o app.'))return
 const r=await sb.from('app_config').update({servers,username:user,password:pass,extra,updated_at:new Date().toISOString()}).eq('id',1)
 if(r.error)return erro(r.error);toast('Servidor salvo');carregar()}

/* ---------- Início ---------- */
let timer
async function iniciar(){
 const{data:{session}}=await sb.auth.getSession()
 ;['vLogin','vNoAdmin','vApp'].forEach(v=>$(v).classList.add('hide'))
 if(!session){$('vLogin').classList.remove('hide');return}
 const{data:adm}=await sb.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle()
 if(!adm){$('naId').textContent=session.user.id;$('vNoAdmin').classList.remove('hide');return}
 $('vApp').classList.remove('hide');await carregar()
 // não atualiza no meio de uma digitação nem com janela aberta
 clearInterval(timer);timer=setInterval(()=>{const a=document.activeElement
  if(!document.hidden&&!$('modal').innerHTML&&tab!=='ajustes'&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))carregar()},20000)}
// voltou do controle pelo botão "voltar" do navegador: recarrega os dados
window.addEventListener('pageshow',e=>{if(e.persisted&&!$('vApp').classList.contains('hide'))carregar()})
iniciar()
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})
</script>
